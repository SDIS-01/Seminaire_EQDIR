function veZones(d){
  const zone = q => {
    const l = d.planned.filter(x => x.qd===q).sort((a,b) => b.ratio - a.ratio);
    return `<div class="qz ${QD[q].cls}" data-qd="${q}"><h4>${q}. ${QD[q].nom} <span class="nom">(${l.length})</span></h4><p class="qs">${QD[q].desc}</p>
      ${l.map(x => `<div class="vcard" tabindex="0" data-vprj="${x.p.id}" style="--suit:${gColor(x.p.porteur)}">
        <div class="vt">${esc(x.p.nom)} ${prioBadge(x.p)} ${ddBadge(x.p)}</div>
        <div class="vm">${esc(gName(x.p.porteur))} — ${vPill(x)} — effort ${x.eff}</div></div>`).join('') || '<div class="empty">Aucun projet</div>'}</div>`;
  };
  return `<div class="qgrid">
    <div></div><div class="qax">Effort faible</div><div class="qax">Effort élevé</div>
    <div class="qay">Valeur élevée</div>${zone(1)}${zone(2)}
    <div class="qay">Valeur faible</div>${zone(3)}${zone(4)}</div>
`;
}

function veClassement(d){
  const l = d.planned.slice().sort((a,b) => b.ratio - a.ratio || b.v - a.v);
  const max = Math.max(...l.map(x => x.ratio));
  const n = l.length;
  // seuils de tiers (les rendements égaux ont la même couleur)
  const r1 = l[Math.max(0, Math.ceil(n/3)-1)].ratio, r2 = l[Math.max(0, Math.ceil(2*n/3)-1)].ratio;
  let h = `<table class="grid fixed"><colgroup><col style="width:5%"><col style="width:33%"><col style="width:12%"><col style="width:11%"><col style="width:8%"><col style="width:17%"><col style="width:14%"></colgroup>
    <tr><th>Rang</th><th>Projet</th><th>Porteur</th><th>Valeur</th><th>Effort</th><th>Rendement (valeur ÷ effort)</th><th>Quadrant</th></tr>`;
  l.forEach((x, i) => {
    const col = x.ratio >= r1 ? '#2e7d4f' : x.ratio >= r2 ? '#e0a526' : '#b42318';
    h += `<tr><td class="c"><b>${i+1}</b></td><td>${esc(x.p.nom)} ${prioBadge(x.p)} ${ddBadge(x.p)}</td>
      <td>${porteurTxt(x.p)}</td><td>${vPill(x)}</td><td class="c">${x.eff}</td>
      <td><div class="rend"><i style="width:${Math.round(70*x.ratio/max)}%; background:${col}"></i><span>${x.ratio.toFixed(2).replace('.',',')}</span></div></td>
      <td>${qBadge(x.qd)}</td></tr>`;
  });
  return h + `</table><p class="legend">Vert : tiers le plus rentable ; orange : tiers intermédiaire ; rouge : tiers le moins rentable.</p>`;
}

// Encadré « Analyse » : texte généré à partir des points de la courbe (déjà triés par rendement)
function veAnalyse(pts, totE, totV, med, cap){
  const pc = (a, t) => t ? Math.round(a/t*100) : 0;
  const pl = (n, m) => `${n} ${m}${n > 1 ? 's' : ''}`;
  const sE = a => a.reduce((t,x) => t + x.eff, 0), sV = a => a.reduce((t,x) => t + x.v, 0);
  const hi = pts.filter(x => x.v >= VAL_HAUTE), lo = pts.filter(x => x.v < VAL_HAUTE);
  const prioHi = Object.keys(VAL_AUTO).filter(k => VAL_AUTO[k] >= VAL_HAUTE).join(', ');
  const nomP = x => `n° ${x.rank} ${esc(x.p.nom)} (${x.eff} pt${x.eff > 1 ? 's' : ''})`;
  let h = `<div class="vana"><b>Analyse</b>`;

  // Synthèse
  h += `<h4>Synthèse</h4><p>`;
  if(!hi.length) h += `Aucun projet de valeur élevée (${prioHi}) parmi les ${pl(pts.length,'projet')} affichés.`;
  else {
    h += `${hi.length > 1 ? 'Les' : 'Le'} <b>${pl(hi.length,'projet')} de valeur élevée</b> (${prioHi}) ${hi.length > 1 ? 'apportent' : 'apporte'} <b>${pc(sV(hi),totV)} % de la valeur</b>
      pour <b>${pc(sE(hi),totE)} % de l'effort</b> (${sE(hi)} pts sur ${totE}).`;
    if(lo.length) h += ` ${lo.length > 1 ? `Les ${lo.length} autres consomment` : "L'autre consomme"} ${pc(sE(lo),totE)} % de l'effort (${sE(lo)} pts) pour ${pc(sV(lo),totV)} % de la valeur.`;
  }
  h += `</p>`;

  // Cassure
  const maxHi = hi.length ? Math.max(...hi.map(x => x.rank)) : 0;
  h += `<h4>Cassure</h4><p>`;
  if(!hi.length || !lo.length) h += `Tous les projets ont le même niveau de valeur : l'ordre de la courbe ne dépend que de l'effort, du plus léger au plus lourd.`;
  else if(maxHi === hi.length) h += `La courbe se casse au point ${hi.length} : c'est la frontière entre les projets de valeur élevée et les autres. Parmi les premiers, l'ordre ne dépend que de l'effort (du plus léger au plus lourd).`;
  else {
    const intrus = pts.filter(x => x.rank < maxHi && x.v < VAL_HAUTE);
    h += `Pas de cassure nette : ${intrus.length > 1 ? 'des projets de valeur plus faible mais légers s\'intercalent' : 'un projet de valeur plus faible mais léger s\'intercale'} parmi ceux de valeur élevée
      (${intrus.map(x => 'n° ' + x.rank).join(', ')}). Le dernier projet de valeur élevée est au rang ${maxHi}.`;
  }
  h += `</p>`;

  // Répartition par priorité
  const ordre = Object.keys(VAL_AUTO);
  pts.forEach(x => { const k = x.p.prio || ''; if(!ordre.includes(k)) ordre.push(k); });
  h += `<h4>Répartition par priorité</h4><table><tr><th>Priorité</th><th>Projets</th><th>Effort</th><th>% effort</th><th>% valeur</th></tr>`;
  ordre.forEach(k => {
    const a = pts.filter(x => (x.p.prio || '') === k);
    h += a.length
      ? `<tr><td>${k ? esc(k) : 'Non renseignée'}</td><td>${a.length}</td><td>${sE(a)}</td><td>${pc(sE(a),totE)} %</td><td>${pc(sV(a),totV)} %</td></tr>`
      : `<tr><td>${esc(k)}</td><td>0</td><td>—</td><td>—</td><td>—</td></tr>`;
  });
  h += `</table>`;

  // Capacité
  if(hi.length){
    const besoin = pts[maxHi-1].ce;      // la capacité se remplit dans l'ordre de la courbe
    h += `<h4>Capacité</h4><p>Il faut <b>${besoin} points</b> pour couvrir tous les projets de valeur élevée${maxHi !== hi.length ? ` (dont ${besoin - sE(hi)} pts pour les projets intercalés)` : ''}.`;
    if(cap) h += cap >= besoin ? ` La capacité saisie (${cap} pts) suffit, avec ${cap - besoin} pt${cap - besoin > 1 ? 's' : ''} de marge.`
                               : ` La capacité saisie (${cap} pts) ne suffit pas : il manque ${besoin - cap} pt${besoin - cap > 1 ? 's' : ''}.`;
    h += `</p>`;
  }

  // Projets à questionner
  const aq = lo.filter(x => x.eff > med).sort((a,b) => b.eff - a.eff || b.rank - a.rank);
  h += `<h4>Projets à questionner</h4><p>`;
  h += aq.length ? `Valeur faible et effort au-dessus de la médiane (${med} pts) : ${aq.map(nomP).join(' ; ')}. Pistes : report, découpage ou réduction de périmètre.`
                 : `Aucun projet de valeur faible avec un effort au-dessus de la médiane (${med} pts).`;
  return h + `</p></div>`;
}

// Barre d'outils de la courbe de Pareto : période (année / trimestre), capacité de la période, analyse
function veParetoBar(d, pq){
  const totE = d.planned.reduce((t,x) => t + x.eff, 0);
  const cap = V.cap[pq] > 0 ? V.cap[pq] : 0;
  return `<div class="toolbar no-print" style="margin:0 0 8px">
      <div class="fg"><label>Période</label><select id="vPq">
        <option value="" ${!pq?'selected':''}>Année complète</option>${Q.map(q => `<option value="${esc(q)}" ${pq===q?'selected':''}>${esc(q)}</option>`).join('')}</select></div>
      <div class="fg"><label>Capacité ${pq ? 'du trimestre' : 'annuelle'} (points d'effort)</label>
      <input type="number" id="vCap" min="0" step="1" value="${cap || ''}" placeholder="Total : ${totE}" style="width:170px; font:inherit; padding:6px 9px; border-radius:6px; border:1px solid #d3cdc3"></div>
      <span class="hint" style="margin:0 0 6px">Facultatif : trace la limite de capacité et marque les projets au-delà.</span>
      <button id="vAna" class="${V.ana?'on':''}" aria-expanded="${V.ana}">Analyse</button></div>`;
}

function vePareto(d, pq){
  const l = d.planned.slice().sort((a,b) => b.ratio - a.ratio || b.v - a.v);
  const totE = l.reduce((t,x) => t + x.eff, 0), totV = l.reduce((t,x) => t + x.v, 0);
  let ce = 0, cv = 0;
  const pts = l.map((x,i) => { ce += x.eff; cv += x.v; return {...x, rank:i+1, ce, cv, pe:ce/totE*100, pv:cv/totV*100}; });
  const cap = V.cap[pq] > 0 ? V.cap[pq] : 0;
  const W = 900, H = 420, ml = 55, mr = 35, mt = 25, mb = 45;
  const X = p => ml + p/100*(W-ml-mr), Y = p => H-mb - p/100*(H-mt-mb);
  let g = `
    <div style="overflow-x:auto"><svg class="scatter" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Courbe de Pareto : valeur cumulée en fonction de l'effort cumulé${pq ? ' — ' + esc(pq) : ''}">`;
  [0,25,50,75,100].forEach(p => {
    g += `<line x1="${ml}" y1="${Y(p)}" x2="${W-mr}" y2="${Y(p)}" stroke="#ece8e1"/>
      <text x="${ml-8}" y="${Y(p)+3}" font-size="10" fill="#6f6a63" text-anchor="end">${p} %</text>
      <text x="${X(p)}" y="${H-mb+14}" font-size="10" fill="#6f6a63" text-anchor="middle">${p} %</text>`;
  });
  g += `<line x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}" stroke="#9a938a"/>
    <line x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}" stroke="#9a938a"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(100)}" y2="${Y(100)}" stroke="#b9b2a6" stroke-dasharray="4 4"/>
    <text x="${(ml+W-mr)/2}" y="${H-8}" font-size="11" fill="#6f6a63" text-anchor="middle">Effort cumulé${pq ? ' sur ' + esc(pq) : ''} (${totE} pts au total)</text>
    <text x="16" y="${(mt+H-mb)/2}" font-size="11" fill="#6f6a63" text-anchor="middle" transform="rotate(-90 16 ${(mt+H-mb)/2})">Valeur cumulée</text>`;
  // zone hors capacité
  if(cap && cap < totE){
    const xc = X(cap/totE*100);
    g += `<rect x="${xc}" y="${mt}" width="${W-mr-xc}" height="${H-mb-mt}" fill="#f6e2e0" opacity=".6"/>
      <line x1="${xc}" y1="${mt}" x2="${xc}" y2="${H-mb}" stroke="#b42318" stroke-width="2"/>
      <text x="${xc+6}" y="${mt+14}" font-size="11" font-weight="600" fill="#b42318">Hors capacité</text>`;
  }
  g += `<polyline fill="none" stroke="#2f5d8a" stroke-width="2.5" points="${X(0)},${Y(0)} ${pts.map(p => `${X(p.pe).toFixed(1)},${Y(p.pv).toFixed(1)}`).join(' ')}"/>`;
  pts.forEach(p => {
    const out = cap && p.ce > cap;
    g += `<g class="pt" data-vprj="${p.p.id}" tabindex="0"><title>${p.rank}. ${esc(p.p.nom)} — valeur ${p.v}, effort ${p.eff} — cumul ${Math.round(p.pe)} % de l'effort, ${Math.round(p.pv)} % de la valeur${out ? ' — hors capacité' : ''}</title>
      <circle cx="${X(p.pe).toFixed(1)}" cy="${Y(p.pv).toFixed(1)}" r="9" fill="${out ? '#fff' : gColor(p.p.porteur)}" stroke="${out ? '#b42318' : '#fff'}" stroke-width="${out ? 2 : 1.5}" ${out ? 'stroke-dasharray="3 2"' : ''}/>
      <text x="${X(p.pe).toFixed(1)}" y="${(Y(p.pv)+3.5).toFixed(1)}" font-size="9" font-weight="600" fill="${out ? '#b42318' : '#fff'}" text-anchor="middle">${p.rank}</text></g>`;
  });
  // repère : 80 % de la valeur
  const k = pts.find(p => p.pv >= 80);
  if(k) g += `<line x1="${X(k.pe)}" y1="${Y(k.pv)}" x2="${X(k.pe)}" y2="${H-mb}" stroke="#2f5d8a" stroke-dasharray="2 3"/>
    <text x="${X(k.pe)+8}" y="${Y(k.pv)+16}" font-size="11" fill="#2a2d33">${Math.round(k.pv)} % de la valeur avec ${Math.round(k.pe)} % de l'effort</text>`;
  g += `</svg></div>`;
  if(V.ana) g += veAnalyse(pts, totE, totV, d.med, cap);
  // tableau
  const inCap = cap ? pts.filter(p => p.ce <= cap) : pts;
  const vIn = inCap.reduce((t,p) => t + p.v, 0);
  if(cap) g += `<p style="margin:6px 0"><b>Avec ${cap} points de capacité :</b> ${inCap.length} projet(s) sur ${pts.length}, soit ${Math.round(vIn/totV*100)} % de la valeur totale.</p>`;
  g += `<table class="grid fixed"><colgroup><col style="width:6%"><col style="width:38%"><col style="width:10%"><col style="width:9%"><col style="width:13%"><col style="width:12%"><col style="width:12%"></colgroup>
    <tr><th>Rang</th><th>Projet</th><th>Valeur</th><th>Effort</th><th>Effort cumulé</th><th>Valeur cumulée</th><th>Capacité</th></tr>
    ${pts.map(p => `<tr><td class="c"><b>${p.rank}</b></td><td>${esc(p.p.nom)} ${prioBadge(p.p)} ${ddBadge(p.p)}<div class="nom">${esc(gName(p.p.porteur))}</div></td>
      <td>${vPill(p)}</td><td class="c">${p.eff}</td><td class="c">${p.ce} (${Math.round(p.pe)} %)</td><td class="c">${Math.round(p.pv)} %</td>
      <td>${!cap ? '—' : p.ce <= cap ? '<span class="qb q1">Dans la capacité</span>' : '<span class="qb q4">Hors capacité</span>'}</td></tr>`).join('')}</table>
    <p class="legend">Projets classés du meilleur au moins bon rendement (valeur ÷ effort). Pointillés gris : progression proportionnelle.
      Plus la courbe est bombée, plus la valeur est concentrée sur peu d'effort. Numéro de point = rang ; couleur = porteur ; cercle blanc à contour rouge pointillé = hors capacité.</p>`;
  return g;
}

// ---- son (carillon) ----
let smAudio = null, smWav = null, smSoundOn = false;
// Secours : même carillon joué par un lecteur audio classique (fichier WAV généré en mémoire)
function smWavUrl(){
  if(smWav) return smWav;
  const rate = 22050, dur = 1.9, n = Math.round(rate*dur), data = new Int16Array(n);
  [659, 784, 1047].forEach((f, k) => {
    const st = Math.round(k*0.22*rate);
    for(let i = 0; i < Math.round(1.2*rate) && st+i < n; i++){
      const t = i/rate, env = Math.min(1, t/0.02) * Math.exp(-t*4);
      data[st+i] += Math.round(9000 * env * Math.sin(2*Math.PI*f*t));
    }
  });
  const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf);
  const w = (o, str) => [...str].forEach((c, i) => v.setUint8(o+i, c.charCodeAt(0)));
  w(0,'RIFF'); v.setUint32(4, 36+n*2, true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, n*2, true);
  for(let i = 0; i < n; i++) v.setInt16(44+i*2, data[i], true);
  smWav = URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
  return smWav;
}
function smChimeFallback(){ try{ const a = new Audio(smWavUrl()); a.play().catch(() => {}); }catch(e){} }
function smChime(){
  if(!smSoundOn) return;
  try{
    if(!smAudio || smAudio.state !== 'running'){
      if(smAudio) smAudio.resume().catch(() => {});
      smChimeFallback();                                // le contexte audio n'est pas actif : lecteur de secours
      return;
    }
    [659, 784, 1047].forEach((f, i) => {
      const o = smAudio.createOscillator(), g = smAudio.createGain(), t = smAudio.currentTime + i*0.22;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.connect(g).connect(smAudio.destination); o.start(t); o.stop(t + 1.3);
    });
  }catch(e){ console.warn(e); }
}
async function smEnableSound(){
  smSoundOn = true;
  try{
    smAudio = smAudio || new (window.AudioContext || window.webkitAudioContext)();
    await smAudio.resume();
  }catch(e){ console.warn(e); }
  smChime();                                            // carillon de test
  render(); smBar();
}

async function pollSeance(){

               duree: t.Duree_min ? +t.Duree_min[0] || 0 : 20, etat: t.Etat ? (t.Etat[0] || 'Préparation') : 'Préparation',
               msg: t.Message ? (t.Message[0] || '') : '' };
  smBar();
  // Affichage automatique quand le tour, l'état ou le message change

    }catch(e){ console.warn(e); }
    const changedTour = !n || n.tour !== smSeance.tour || n.etat !== smSeance.etat;
    if(smSeance.etat !== 'Préparation') {
      smShowOverlay();                                  // aussi à l'arrivée d'un participant en cours de séance
      if(smSeenInit && changedTour && smSeance.etat === 'En cours') smChime();
    }
  }
  smSeenInit = true;
  if(view === 'sm' && !pwdOpen && !(document.activeElement && /^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName))) render();
}
function smTime(v){
  if(v === null || v === undefined || v === '') return null;
  if(typeof v === 'number') return v;
  if(Array.isArray(v) && typeof v[1] === 'number') return v[1];      // valeur encodée Grist ['d', …]
  const ms = Date.parse(v); return isNaN(ms) ? null : Math.round(ms/1000);
}
const loadSeqDone = () => loadSeq > 0 && !pending;
function smLine(me, tour){
  const ro = smRole(me, tour);
  if(ro.type==='vis') return {titre:'Changez de table', texte:`Vous avez rendez-vous avec <b>${esc(smName(ro.autre))}</b>`, big:`Table ${esc(smName(ro.autre))}`, court:`Allez à la table ${smName(ro.autre)}`};
  if(ro.type==='hote') return {titre:'Restez à votre table', texte:`Vous recevez <b>${esc(smName(ro.autre))}</b>`, big:`Table ${esc(smName(me))}`, court:`Vous recevez ${smName(ro.autre)} (table ${smName(me)})`};
  return {titre:'Tour libre', texte:esc(SM_LIBRE), big:'', court:SM_LIBRE};
}
function smShowOverlay(){
  const S2 = smSeance, box = $('#smov'); if(!S2) return;
  const me = smMe();
  let inner;
  if(S2.etat === 'Terminée') inner = `<h2>Speed meeting terminé</h2><p>Merci à tous.</p>`;
  else if(S2.etat === 'Pause') inner = `<span class="tr">Tour ${S2.tour} sur ${smTours()}</span><h2>Pause</h2><p>Le tour reprendra dans un instant.</p>`;
  else if(!me) inner = `<span class="tr">Tour ${S2.tour} sur ${smTours()}</span><h2>Changement de tour</h2><p>Choisissez votre table dans l'onglet Speed meeting pour voir votre rendez-vous.</p>`;
  else {
    const L = smLine(me, S2.tour);
    inner = `<span class="tr">Tour ${S2.tour} sur ${smTours()}</span><h2>${L.titre}</h2><p>${L.texte}</p>${L.big ? `<div class="big">${L.big}</div>` : ''}
      <div class="cd" data-smcd>${mmss(smRemaining())}</div>`;
  }
  if(S2.msg) inner += `<p style="margin-top:14px; font-size:17px; color:var(--red)"><b>${esc(S2.msg)}</b></p>`;
  box.innerHTML = `<div class="smov" id="smovBd"><div class="smbox" role="alertdialog" aria-live="assertive">${inner}
    <div style="margin-top:18px"><button class="primary" id="smOk">J'ai compris</button>
    ${smSoundOn ? '' : ' <button id="smOvSound">🔇 Activer le son</button>'}</div></div></div>`;
  $('#smOk').onclick = () => { box.innerHTML = ''; };
  if($('#smOvSound')) $('#smOvSound').onclick = e => { e.target.remove(); smEnableSound(); };
  $('#smOk').focus();
}
function smBar(){
  const b = $('#smbar'), S2 = smSeance, me = smMe();
  if(!S2 || !['En cours','Pause'].includes(S2.etat)){ b.style.display = 'none'; return; }
  const L = me ? smLine(me, S2.tour) : {court:'choisissez votre table (onglet Speed meeting)'};
  b.style.display = 'flex';
  b.innerHTML = `<b>Speed meeting — tour ${S2.tour}/${smTours()}</b>
    <span class="cd" data-smcd>${S2.etat==='Pause' ? 'Pause' : mmss(smRemaining())}</span>
    <span>${me ? esc(smName(me)) + ' : ' : ''}${esc(L.court)}</span>
    ${S2.msg ? `<span>— ${esc(S2.msg)}</span>` : ''}
    <button id="smBarOpen">Voir</button>
    ${smSoundOn ? '' : '<button id="smBarSound">🔇 Activer le son</button>'}`;
  $('#smBarOpen').onclick = smShowOverlay;
  if($('#smBarSound')) $('#smBarSound').onclick = smEnableSound;
}
setInterval(pollSeance, SM_POLL_MS);
setInterval(() => {
  if(!smSeance) return;
  const txt = smSeance.etat==='Pause' ? 'Pause' : smRemaining() ? mmss(smRemaining()) : 'Temps écoulé';
  document.querySelectorAll('[data-smcd]').forEach(e => e.textContent = txt);
}, 1000);

// ---- pilotage (administration) ----
async function smSetSeance(fields){
  if(!await requireAdmin()) return;
  try{
    if(smSeance && smSeance.id) await grist.docApi.applyUserActions([['UpdateRecord', T_SMS, smSeance.id, fields]]);
    else await grist.docApi.applyUserActions([['AddRecord', T_SMS, null, Object.assign({Tour_actif:1, Duree_min:SMU.duree, Etat:'Préparation', Message:''}, fields)]]);
  }catch(err){ alert("Écriture impossible dans SM_Seance : " + err.message); }
  await pollSeance();
}
const nowS = () => Math.round(Date.now()/1000);
const smGoTour = t => smSetSeance({Tour_actif:t, Debut_tour:nowS(), Duree_min:SMU.duree, Etat:'En cours'});
async function smPause(){
  if(!smSeance) return;
  if(smSeance.etat === 'Pause') return smSetSeance({Debut_tour:nowS(), Etat:'En cours'});
  return smSetSeance({Duree_min: smRemaining()/60, Debut_tour:null, Etat:'Pause'});
}

// Proposition automatique : tournoi toutes rondes (méthode du cercle), ajustable ensuite dans la grille
async function smGenerate(){
  if(!await requireAdmin()) return;
  const ps = smParts.map(p => p.id);
  if(ps.length < 2){ alert('Renseignez au moins deux participants dans SM_Participants.'); return; }
  // nombre impair : une place « libre » fictive (0) donne un tour libre à chacun ; nombre pair : n-1 tours sans pause
  const arr = ps.length % 2 ? [...ps, 0] : [...ps];
  const n = arr.length, rounds = n - 1, hosted = {};
  const grpOf = id => (smParts.find(p => p.id===id) || {}).grp;
  const rows = [];
  let cur = arr.slice();
  for(let r = 0; r < rounds; r++){
    for(let i = 0; i < n/2; i++){
      const a = cur[i], b = cur[n-1-i];
      if(a <= 0 || b <= 0) continue;
      if(SMU.excl && grpOf(a) && grpOf(a) === grpOf(b)) continue;
      // alternance recevoir / se déplacer (équilibre de la méthode du cercle)
      const [h, v] = (i === 0 ? r % 2 === 0 : i % 2 === 1) ? [a, b] : [b, a];
      hosted[h] = (hosted[h]||0) + 1;
      rows.push({tour:r+1, h, v});
    }
    cur = [cur[0], cur[n-1], ...cur.slice(1, n-1)];
  }
  // tours sans aucune rencontre supprimés, numérotation compacte
  const used = [...new Set(rows.map(x => x.tour))].sort((a,b) => a-b);
  rows.forEach(x => x.tour = used.indexOf(x.tour) + 1);
  if(!confirm(`Proposition : ${used.length} tours, ${rows.length} rencontres.\n\nRemplacer les ${smRots.length} rotation(s) existante(s) ?`)) return;
  await act([...smRots.map(r => ['RemoveRecord', T_SMR, r.id]),
             ...rows.map(x => ['AddRecord', T_SMR, null, {Tour:x.tour, Hote:x.h, Visiteur:x.v}])]);
}
async function smAddPair(){
  if(!await requireAdmin()) return;
  const t = +$('#smT').value, h = +$('#smH').value, v = +$('#smV').value;
  if(!t || !h || !v){ alert('Choisissez le tour, la table qui reçoit et la table qui se déplace.'); return; }
  if(h === v){ alert('Une table ne peut pas se recevoir elle-même.'); return; }
  const busy = smRots.filter(r => r.tour===t).flatMap(r => [r.hote, r.vis]);
  if((busy.includes(h) || busy.includes(v)) && !confirm('Une de ces tables a déjà un rendez-vous à ce tour. Ajouter quand même ?')) return;
  SMU.tour = t;
  await act([['AddRecord', T_SMR, null, {Tour:t, Hote:h, Visiteur:v}]]);
}
async function smDelPair(id){ if(await requireAdmin()) await act([['RemoveRecord', T_SMR, id]]); }
async function smSwap(id){
  if(!await requireAdmin()) return;
  const r = smRots.find(x => x.id===id); if(r) await act([['UpdateRecord', T_SMR, id, {Hote:r.vis, Visiteur:r.hote}]]);
}

function viewSM(){
  if(!hasSM) return `<div class="sheet"><h2>Speed meeting</h2><p class="empty">Créez dans Grist les tables <b>SM_Participants</b> (Nom, Groupement),
    <b>SM_Rotations</b> (Tour, Hote, Visiteur) et <b>SM_Seance</b> (Tour_actif, Debut_tour, Duree_min, Etat, Message).</p></div>`;
  const me = smMe(), S2 = smSeance, nT = smTours();
  let h = `<div class="sheet"><h2>Speed meeting — mon programme</h2>
    <div class="toolbar" style="margin:6px 0 10px">
      <div class="fg"><label>Ma table</label><select id="smMe">${opts(smParts, me, [0,'— choisir —'])}</select></div>
      <button id="smSound" class="${smSoundOn ? '' : 'admin'}">${smSoundOn ? '🔔 Son activé (tester)' : '🔇 Activer le son'}</button>
    </div>`;
  if(S2 && ['En cours','Pause'].includes(S2.etat) && me){
    const L = smLine(me, S2.tour);
    h += `<div class="fdet" style="font-size:15px"><b>Tour ${S2.tour} — ${L.titre}</b> : ${L.court} — <span data-smcd>${mmss(smRemaining())}</span></div>`;
  }
  if(me){
    h += `<table class="grid fixed" style="margin-top:8px"><colgroup><col style="width:12%"><col style="width:30%"><col style="width:58%"></colgroup>
      <tr><th>Tour</th><th>Consigne</th><th>Rendez-vous</th></tr>`;
    for(let t = 1; t <= nT; t++){
      const ro = smRole(me, t);
      const cons = ro.type==='vis' ? 'Changer de table' : ro.type==='hote' ? 'Rester à ma table' : 'Tour libre';
      const rdv = ro.type==='vis' ? `${esc(smName(ro.autre))} — table ${esc(smName(ro.autre))}` : ro.type==='hote' ? `Je reçois ${esc(smName(ro.autre))}` : esc(SM_LIBRE);
      h += `<tr style="${S2 && S2.tour===t && S2.etat!=='Préparation' ? 'background:#fff8e1' : ''}"><td class="c"><b>${t}</b></td><td>${cons}</td><td>${rdv}</td></tr>`;
    }
    h += `</table>`;
  } else h += `<p class="hint">Choisissez votre table : ce choix est mémorisé sur ce poste. Pensez à activer le son.</p>`;
  h += `</div>`;

  // ---------- administration ----------
  if(!unlocked){
    h += `<div class="sheet no-print"><h2>Pilotage</h2><p class="hint">Réservé à l'administration.</p><button class="admin" id="smUnlock">🔒 Déverrouiller</button></div>`;
  } else {
    h += `<div class="sheet no-print"><h2>Pilotage</h2>
      ${S2 && S2.etat==='En cours' && (!S2.debut || S2.debut + S2.duree*60 < Date.now()/1000 - 5 && Date.now()/1000 - S2.debut > 86400)
        ? `<p class="hint" style="color:var(--red)">Le début du tour enregistré est incohérent : vérifiez que la colonne SM_Seance.Debut_tour est de type « Date et heure » (et non « Date »).</p>` : ''}
      <div class="meta">État : <b>${S2 ? esc(S2.etat) : 'aucune séance'}</b>${S2 ? ` — tour ${S2.tour}/${nT} — ${S2.etat==='En cours' ? 'reste ' + mmss(smRemaining()) : ''}` : ''}</div>
      <div class="toolbar">
        <div class="fg"><label>Durée d'un tour (min)</label><input type="number" id="smDur" min="1" value="${SMU.duree}" style="width:90px; font:inherit; padding:6px 9px; border-radius:6px; border:1px solid #d3cdc3"></div>
        <button class="primary" id="smStart">▶ Démarrer (tour 1)</button>
        <button id="smPrev" ${S2 && S2.tour > 1 ? '' : 'disabled'}>◀ Tour précédent</button>
        <button id="smNext" ${S2 && S2.tour < nT ? '' : 'disabled'}>Tour suivant ▶</button>
        <button id="smPause" ${S2 && ['En cours','Pause'].includes(S2.etat) ? '' : 'disabled'}>${S2 && S2.etat==='Pause' ? 'Reprendre' : 'Pause'}</button>
        <button class="danger" id="smEnd" ${S2 ? '' : 'disabled'}>Terminer</button>
      </div>
      <div class="toolbar">
        <div class="fg" style="flex:1"><label>Message diffusé à tous</label><input type="text" id="smMsg" value="${esc(S2 ? S2.msg : '')}" placeholder="Ex. : 5 minutes de pause supplémentaires"></div>
        <button id="smMsgGo">Diffuser</button><button id="smMsgClear">Effacer</button>
      </div></div>`;

    // grille tours × participants
    const cnt = {}, pairs = {};
    smRots.forEach(r => {
      [r.hote, r.vis].forEach(p => { const k = r.tour+'|'+p; cnt[k] = (cnt[k]||0) + 1; });
      const pk = [r.hote, r.vis].sort().join('-'); pairs[pk] = (pairs[pk]||0) + 1;
    });
    h += `<div class="sheet no-print"><h2>Rencontres</h2>
      <div class="toolbar">
        <button id="smGen">Proposer une répartition automatique</button>
        <label class="ck" style="font-size:12px; display:flex; gap:4px; align-items:center"><input type="checkbox" id="smExcl" ${SMU.excl?'checked':''}> Pas de rencontre entre tables d'un même groupement</label>
      </div>
      <p class="hint" style="margin:0 0 6px">⌂ reçoit à sa table · → se déplace vers la table indiquée · rouge : table placée deux fois dans le tour · contour orange : rencontre en double.</p>
      <div style="overflow-x:auto"><table class="grid smgrid"><tr><th>Tour</th>${smParts.map(p => `<th>${esc(p.nom)}</th>`).join('')}</tr>`;
    for(let t = 1; t <= Math.max(nT, 1); t++){
      h += `<tr class="${S2 && S2.tour===t && S2.etat!=='Préparation' ? 'cur' : ''}"><th>${t}</th>`;
      smParts.forEach(p => {
        const ro = smRole(p.id, t), bad = (cnt[t+'|'+p.id]||0) > 1;
        const dup = ro.r && pairs[[ro.r.hote, ro.r.vis].sort().join('-')] > 1;
        const txt = ro.type==='hote' ? '⌂ ' + smName(ro.autre) : ro.type==='vis' ? '→ ' + smName(ro.autre) : '—';
        h += `<td class="${bad ? 'bad' : ro.type==='hote' ? 'h' : ro.type==='vis' ? 'v' : ''} ${dup ? 'dup' : ''}">${esc(txt)}</td>`;
      });
      h += `</tr>`;
    }
    h += `</table></div>
      <h3>Modifier un tour</h3>
      <div class="toolbar">
        <div class="fg"><label>Tour</label><input type="number" id="smT" min="1" value="${SMU.tour}" style="width:80px; font:inherit; padding:6px 9px; border-radius:6px; border:1px solid #d3cdc3"></div>
        <div class="fg"><label>Table qui reçoit</label><select id="smH">${opts(smParts, 0, [0,'—'])}</select></div>
        <div class="fg"><label>Table qui se déplace</label><select id="smV">${opts(smParts, 0, [0,'—'])}</select></div>
        <button class="primary" id="smAdd">Ajouter la rencontre</button>
      </div>
      <div>${smRots.filter(r => r.tour===SMU.tour).map(r => `<span class="pair">⌂ ${esc(smName(r.hote))} ← ${esc(smName(r.vis))}
          <button data-smswap="${r.id}" title="Inverser qui reçoit">⇄</button><button data-smdel="${r.id}" title="Supprimer">✕</button></span>`).join('')
        || `<span class="hint">Aucune rencontre au tour ${SMU.tour}.</span>`}</div>
      <p class="hint">Tables libres au tour ${SMU.tour} : ${esc(smParts.filter(p => smRole(p.id, SMU.tour).type==='libre').map(p => p.nom).join(', ') || 'aucune')}.</p>
    </div>`;
  }
  setTimeout(bindSM);
  return h;
}
function bindSM(){
  if($('#smMe')) $('#smMe').onchange = e => { lsSet('sm_me', e.target.value); smBar(); render(); };
  if($('#smSound')) $('#smSound').onclick = smEnableSound;
  if($('#smUnlock')) $('#smUnlock').onclick = async () => { if(await requireAdmin()) render(); };
  if(!unlocked || !$('#smStart')) return;
  $('#smDur').onchange = e => { SMU.duree = Math.max(1, +e.target.value || 20); };
  $('#smStart').onclick = () => { if(confirm('Démarrer le speed meeting au tour 1 ?')) smGoTour(1); };
  $('#smPrev').onclick = () => smGoTour(smSeance.tour - 1);
  $('#smNext').onclick = () => smGoTour(smSeance.tour + 1);
  $('#smPause').onclick = smPause;
  $('#smEnd').onclick = () => { if(confirm('Terminer le speed meeting ?')) smSetSeance({Etat:'Terminée'}); };
  $('#smMsgGo').onclick = () => smSetSeance({Message: $('#smMsg').value.trim()});
  $('#smMsgClear').onclick = () => smSetSeance({Message: ''});
  $('#smGen').onclick = smGenerate;
  $('#smExcl').onchange = e => { SMU.excl = e.target.checked; };
  $('#smT').onchange = e => { SMU.tour = Math.max(1, +e.target.value || 1); render(); };
  $('#smAdd').onclick = smAddPair;
  document.querySelectorAll('[data-smdel]').forEach(b => b.onclick = () => smDelPair(+b.dataset.smdel));
  document.querySelectorAll('[data-smswap]').forEach(b => b.onclick = () => smSwap(+b.dataset.smswap));
}

/* ================= Rafraîchissement automatique ================= */
// Ignoré si : onglet masqué, glisser en cours, fiche projet ouverte, ou liste/saisie en cours d'utilisation
setInterval(() => {
  if(document.hidden || dragging || modalPrj || pwdOpen || pending) return;
  const el = document.activeElement;
  if(el && /^(SELECT|INPUT|TEXTAREA)$/.test(el.tagName)) return;
  loadAll(true);
}, REFRESH_MS);

loadAll();
</script>
