<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Planning projets 2027</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --table:#2f5d50; --table-dark:#244a40; --paper:#fbfaf6; --ink:#23262a; --muted:#6b6f75;
    --line:#d9d6cc; --col:#e9eee9;
    --ok:#2e7d4f; --ok-bg:#dff1e6; --warn:#a86a00; --warn-bg:#fbeccb; --over:#b3261e; --over-bg:#f8dcd9;
  }
  *{box-sizing:border-box;}
  body{font-family:"Segoe UI",Tahoma,Helvetica,Arial,sans-serif; margin:0; color:var(--ink); background:#f3f2ed; font-size:13px;}
  header{background:var(--table); color:#fff; padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  header h1{font-size:16px; margin:0 12px 0 0; font-weight:600;}
  .tabs{display:flex; gap:4px; flex-wrap:wrap;}
  .tab{background:transparent; color:#dfe9e5; border:1px solid transparent; padding:6px 11px; border-radius:6px; cursor:pointer; font:inherit;}
  .tab:hover{background:var(--table-dark);}
  .tab.on{background:var(--paper); color:var(--table); font-weight:600;}
  .hright{margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12px;}
  .hright input{width:48px; padding:3px 5px; border-radius:4px; border:0; font:inherit;}
  main{padding:14px;}
  select,button,input[type=text]{font:inherit; padding:6px 9px; border-radius:6px; border:1px solid #bdb9ad; background:#fff; color:var(--ink);}
  button{cursor:pointer;} button:hover{background:#efede6;}
  button.primary{background:var(--table); color:#fff; border-color:var(--table);} button.primary:hover{background:var(--table-dark);}
  button.danger{color:var(--over); border-color:#e1b3ae;}
  button:focus-visible,select:focus-visible,.card:focus-visible,.cell:focus-visible{outline:2px solid #1d6fd1; outline-offset:1px;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;}
  .fg{display:flex; flex-direction:column; gap:3px;} .fg label{font-size:11px; color:var(--muted);}
  .status{padding:8px 14px; color:var(--muted);} .status.err{color:var(--over);}
  .hint{font-size:11px; color:var(--muted); margin:8px 0 0;}

  /* Kanban */
  .board{display:grid; grid-template-columns:minmax(170px,.8fr) repeat(4,minmax(0,1fr)); gap:10px; align-items:start;}
  .col{background:var(--col); border-radius:10px; padding:8px; min-height:320px; border:2px dashed transparent;}
  .col.todo{background:#e7e4da;}
  .col.over{border-color:var(--table);}
  .col-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; gap:6px;}
  .col-head b{font-size:14px;} .col-head .n{font-size:11px; color:var(--muted);}
  .gauge{height:6px; background:#fff; border-radius:3px; overflow:hidden; margin:-2px 0 8px;}
  .gauge i{display:block; height:100%;}
  .gauge-lbl{font-size:11px; margin:-4px 0 8px;}
  .card{background:var(--paper); border-radius:8px; padding:8px 9px 8px 13px; margin-bottom:8px; cursor:grab; position:relative;
        box-shadow:0 1px 0 #cfccc2, 0 2px 4px rgba(40,50,45,.08); border:1px solid #e3e0d7;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; border-radius:8px 0 0 8px; background:var(--suit);}
  .card:active{cursor:grabbing;}
  .card .t{font-weight:600; margin-bottom:5px; line-height:1.25;}
  .suit{display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:10px; color:#fff; background:var(--suit);}
  .chips{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px;}
  .chip{font-size:10px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); background:#fff; white-space:nowrap;}
  .chip.Fort{border-color:#e1b3ae; background:var(--over-bg); color:var(--over); font-weight:600;}
  .chip.Faible{border-color:#e8d3a4; background:var(--warn-bg); color:var(--warn);}
  .empty{font-size:12px; color:var(--muted); padding:6px 2px;}

  /* Modal */
  .backdrop{position:fixed; inset:0; background:rgba(20,30,25,.45); display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; z-index:10;}
  .modal{background:#fff; border-radius:10px; width:min(860px,100%); padding:16px 18px; box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 12px; font-size:16px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;}
  .row input[type=text]{min-width:260px; flex:1;}
  h3{font-size:13px; margin:16px 0 6px;}

  /* Grilles */
  table.grid{border-collapse:collapse; width:100%; background:#fff;}
  .grid th,.grid td{border:1px solid var(--line); padding:5px 7px; text-align:left; vertical-align:top;}
  .grid th{background:#f1efe8; font-weight:600; font-size:12px;}
  .grid td.c{text-align:center; vertical-align:middle;}
  .cell{cursor:pointer; min-width:70px; height:30px; user-select:none;}
  .cell:hover{background:#f4f3ee;}
  .porteur-row td:first-child{font-weight:600;}
  .heat{font-weight:600; text-align:center; min-width:90px;}
  .lvl-0{background:#fff; color:var(--muted);}
  .lvl-ok{background:var(--ok-bg); color:var(--ok);}
  .lvl-warn{background:var(--warn-bg); color:var(--warn);}
  .lvl-over{background:var(--over-bg); color:var(--over);}
  .sub td{font-size:12px; background:#fafaf7;}
  .sub td:first-child{padding-left:22px;}
  .toggle{cursor:pointer;}
  .nom{font-size:11px; color:var(--muted);}
  .via{opacity:.65; font-style:italic;}

  /* Etats imprimables */
  .sheet{background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:14px;}
  .sheet h2{margin:0 0 2px; font-size:17px;}
  .sheet .meta{color:var(--muted); font-size:11px; margin-bottom:10px;}
  .legend{font-size:11px; color:var(--muted); margin-top:8px;}
  @media print{
    @page{size:A4 landscape; margin:10mm;}
    body{background:#fff;}
    header,.no-print,.status{display:none !important;}
    main{padding:0;}
    .sheet{border:0; padding:0; margin:0; page-break-after:always;}
    .sheet:last-child{page-break-after:auto;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
  @media (max-width:900px){ .board{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>

<header>
  <h1>Planning projets 2027</h1>
  <nav class="tabs">
    <button class="tab" data-v="kanban">Kanban</button>
    <button class="tab" data-v="charge">Charge</button>
    <button class="tab" data-v="etat">État groupement / personne</button>
    <button class="tab" data-v="projet">État par projet</button>
  </nav>
  <div class="hright">
    <label>Seuil de charge <input id="seuil" type="number" min="1" step="1"></label>
    <button id="refresh" title="Recharger les données">Actualiser</button>
  </div>
</header>
<div id="status" class="status">Connexion à Grist…</div>
<main id="app"></main>
<div id="modal"></div>

<script>
/* ================= Configuration ================= */
const T = { GRP:'Groupement', COL:'Collaborateur', PRJ:'Projet', AFF:'Affectation' };
const Q = ['T1 - 2027','T2 - 2027','T3 - 2027','T4 - 2027'];
const QS = ['T1','T2','T3','T4'];                 // libellés courts
const POIDS = { Faible:1, Fort:2 };
const SEUIL_DEFAUT = 6;                            // points par trimestre
const PALETTE = ['#1f6fb2','#c0392b','#2e8b57','#8e44ad','#d35400','#16a085','#7f5539',
                 '#b8336a','#3d5a80','#6a994e','#bc6c25','#5e548e','#0081a7','#9c6644'];

/* ================= État ================= */
let grps=[], collabs=[], projets=[], affs=[], hasCollab=false;
let seuil = SEUIL_DEFAUT;
let view = 'kanban';
const F = { porteur:0, impacte:0, collab:0 };      // filtres kanban
let modalPrj = null;                                // id projet ouvert
let chargeOpen = new Set();
const E = { type:'grp', id:'all', prj:'all' };      // sélection des états
let loadSeq = 0;

/* ================= Utilitaires ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gName = id => (grps.find(g=>g.id===id)||{}).nom || '—';
const cName = id => (collabs.find(c=>c.id===id)||{}).nom || '—';
const pObj  = id => projets.find(p=>p.id===id);
const gColor = id => { const i = grps.findIndex(g=>g.id===id); return i<0 ? '#8a8a8a' : PALETTE[i % PALETTE.length]; };
const pts = a => POIDS[a.imp] || 0;
const sum = arr => arr.reduce((s,a)=>s+pts(a),0);
const chargeGrp = (g,q) => sum(affs.filter(a=>a.grp===g && a.q===q));
const chargeCol = (c,q) => sum(affs.filter(a=>a.col===c && a.q===q));
const lvl = v => v<=0 ? 'lvl-0' : v/seuil < .7 ? 'lvl-ok' : v<=seuil ? 'lvl-warn' : 'lvl-over';
const lvlColor = v => ({'lvl-0':'#cfcfcf','lvl-ok':'var(--ok)','lvl-warn':'var(--warn)','lvl-over':'var(--over)'})[lvl(v)];
const today = () => new Date().toLocaleDateString('fr-FR');
const opts = (list, sel, all) => (all ? `<option value="${all[0]}">${esc(all[1])}</option>` : '') +
  list.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.nom)}</option>`).join('');
function setStatus(msg, err){ const s=$('#status'); s.textContent=msg||''; s.className='status'+(err?' err':''); s.style.display=msg?'':'none'; }

/* ================= Grist ================= */
grist.ready({ requiredAccess:'full' });
grist.onRecords(() => loadAll());
grist.onOptions(o => { if(o && o.seuil){ seuil = Number(o.seuil)||SEUIL_DEFAUT; $('#seuil').value = seuil; render(); } });

async function loadAll(){
  const seq = ++loadSeq;
  try{
    const [g,c,p,a] = await Promise.all([T.GRP,T.COL,T.PRJ,T.AFF].map(t=>grist.docApi.fetchTable(t)));
    if(seq !== loadSeq) return;
    grps = g.id.map((id,i)=>({id, nom:g.Groupement[i]||'(sans nom)'}));
    collabs = c.id.map((id,i)=>({id, nom:c.Collaborateur[i]||'(sans nom)', grp:c.Groupement[i]}))
               .sort((x,y)=>x.nom.localeCompare(y.nom,'fr'));
    projets = p.id.map((id,i)=>({id, nom:p.Libelle_Projet[i]||'(sans titre)', porteur:p.Groupement_Porteur[i]}))
               .sort((x,y)=>x.nom.localeCompare(y.nom,'fr'));
    hasCollab = 'Collaborateur' in a;
    affs = a.id.map((id,i)=>({id, prj:a.Projet[i], grp:a.Groupement[i], col:hasCollab ? (a.Collaborateur[i]||0) : 0,
                              q:a.Trimestre[i], imp:a.Impact[i]}));
    setStatus(hasCollab ? '' : "Colonne Affectation.Collaborateur absente : la distinction par personne est désactivée.");
    render();
  }catch(err){
    console.error(err);
    setStatus(`Chargement impossible. Vérifiez les tables ${Object.values(T).join(', ')} et l'accès complet du widget.`, true);
  }
}
async function act(actions){
  if(!actions.length) return;
  try{ const r = await grist.docApi.applyUserActions(actions); await loadAll(); return r; }
  catch(err){ console.error(err); setStatus("Écriture refusée : " + err.message, true); }
}
function affFields(prj, grp, col, q, imp){
  const f = { Projet:prj, Groupement:grp, Trimestre:q, Impact:imp };
  if(hasCollab) f.Collaborateur = col || 0;
  return f;
}
const addAff = (prj,grp,col,q,imp) => ['AddRecord', T.AFF, null, affFields(prj,grp,col,q,imp)];

/* ================= Navigation ================= */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
$('#refresh').onclick = () => loadAll();
$('#seuil').value = seuil;
$('#seuil').onchange = e => {
  const v = Math.max(1, Number(e.target.value)||SEUIL_DEFAUT);
  seuil = v; e.target.value = v; render();
  grist.setOption('seuil', v).catch(()=>{});
};

function render(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v===view));
  const app = $('#app');
  if(view==='kanban') app.innerHTML = viewKanban();
  else if(view==='charge') app.innerHTML = viewCharge();
  else if(view==='etat') app.innerHTML = viewEtat();
  else app.innerHTML = viewEtatProjet();
  if(view==='kanban') bindKanban();
  renderModal();
}

/* ================= Vue Kanban ================= */
function visibleAffs(prjId, q){
  let l = affs.filter(a=>a.prj===prjId && a.q===q);
  if(F.impacte) l = l.filter(a=>a.grp===F.impacte);
  if(F.collab)  l = l.filter(a=>a.col===F.collab);
  return l;
}
function chipsHtml(list){
  // Regroupe par groupement : impact le plus fort + noms des personnes
  const by = {};
  list.forEach(a => {
    const k = a.grp; by[k] = by[k] || {imp:'Faible', noms:[], grpLevel:false};
    if(a.imp==='Fort') by[k].imp = 'Fort';
    if(a.col) by[k].noms.push(cName(a.col)); else by[k].grpLevel = true;
  });
  return Object.entries(by).map(([g,v]) => {
    const title = `${gName(+g)} — impact ${v.imp}` + (v.noms.length ? ` — ${v.noms.join(', ')}` : '');
    const extra = v.noms.length ? ` · ${v.noms.length}👤` : '';
    return `<span class="chip ${v.imp}" title="${esc(title)}">${esc(gName(+g))}${extra}</span>`;
  }).join('');
}
function cardHtml(p, q, list){
  return `<div class="card" tabindex="0" draggable="true" style="--suit:${gColor(p.porteur)}"
            data-prj="${p.id}" data-q="${q===null?'':Q.indexOf(q)}">
    <div class="t">${esc(p.nom)}</div>
    <span class="suit">${esc(gName(p.porteur))}</span>
    ${list ? `<div class="chips">${chipsHtml(list)}</div>` : ''}
  </div>`;
}
function viewKanban(){
  const collabList = F.impacte ? collabs.filter(c=>c.grp===F.impacte) : collabs;
  let h = `<div class="toolbar">
    <div class="fg"><label>Groupement porteur</label>
      <select id="fPorteur">${opts(grps, F.porteur, [0,'Tous'])}</select></div>
    <div class="fg"><label>Groupement impacté</label>
      <select id="fImpacte">${opts(grps, F.impacte, [0,'Tous'])}</select></div>
    ${hasCollab ? `<div class="fg"><label>Collaborateur</label>
      <select id="fCollab">${opts(collabList, F.collab, [0,'Tous'])}</select></div>` : ''}
    <button id="fReset">Réinitialiser</button>
    <button class="primary" id="newPrj">Nouveau projet</button>
  </div><div class="board">`;

  // Colonne "À planifier" : projets sans aucune affectation
  const todo = projets.filter(p => (!F.porteur || p.porteur===F.porteur) && !affs.some(a=>a.prj===p.id));
  h += `<div class="col todo" data-drop=""><div class="col-head"><b>À planifier</b><span class="n">${todo.length}</span></div>`;
  h += todo.length ? todo.map(p=>cardHtml(p,null,null)).join('') : `<div class="empty">Tous les projets sont placés.</div>`;
  h += `</div>`;

  Q.forEach((q,qi) => {
    const cards = projets.filter(p => !F.porteur || p.porteur===F.porteur)
                         .map(p => [p, visibleAffs(p.id,q)]).filter(([,l])=>l.length);
    h += `<div class="col" data-drop="${qi}"><div class="col-head"><b>${QS[qi]}</b><span class="n">${cards.length} projet(s)</span></div>`;
    const target = F.collab ? ['col',F.collab] : F.impacte ? ['grp',F.impacte] : null;
    if(target){
      const v = target[0]==='col' ? chargeCol(target[1],q) : chargeGrp(target[1],q);
      const w = Math.min(100, v/seuil*100);
      h += `<div class="gauge-lbl" style="color:${lvlColor(v)}">Charge ${esc(target[0]==='col'?cName(target[1]):gName(target[1]))} : ${v} / ${seuil} pts</div>
            <div class="gauge"><i style="width:${w}%;background:${lvlColor(v)}"></i></div>`;
    }
    h += cards.length ? cards.map(([p,l])=>cardHtml(p,q,l)).join('') : `<div class="empty">Déposez un projet ici.</div>`;
    h += `</div>`;
  });
  h += `</div><p class="hint">Glisser une carte déplace toutes les affectations du projet sur ce trimestre.
    Maj + glisser la copie (projet sur plusieurs trimestres). Depuis « À planifier », le projet est affecté
    au groupement impacté filtré, sinon au groupement porteur, en impact faible. Clic sur une carte : affectations détaillées.</p>`;
  return h;
}
function bindKanban(){
  $('#fPorteur').onchange = e => { F.porteur = +e.target.value; render(); };
  $('#fImpacte').onchange = e => { F.impacte = +e.target.value;
    if(F.collab && (collabs.find(c=>c.id===F.collab)||{}).grp !== F.impacte && F.impacte) F.collab = 0; render(); };
  if($('#fCollab')) $('#fCollab').onchange = e => { F.collab = +e.target.value; render(); };
  $('#fReset').onclick = () => { F.porteur=F.impacte=F.collab=0; render(); };
  $('#newPrj').onclick = newProject;

  document.querySelectorAll('.card').forEach(c => {
    c.ondragstart = e => e.dataTransfer.setData('text/plain', JSON.stringify({prj:+c.dataset.prj, q:c.dataset.q}));
    c.onclick = () => openModal(+c.dataset.prj);
    c.onkeydown = e => { if(e.key==='Enter') openModal(+c.dataset.prj); };
  });
  document.querySelectorAll('.col').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = () => col.classList.remove('over');
    col.ondrop = e => {
      e.preventDefault(); col.classList.remove('over');
      let d; try{ d = JSON.parse(e.dataTransfer.getData('text/plain')); }catch{ return; }
      const from = d.q === '' ? null : Q[+d.q];
      const to = col.dataset.drop === '' ? null : Q[+col.dataset.drop];
      moveProject(d.prj, from, to, e.shiftKey);
    };
  });
}
async function moveProject(prjId, from, to, copy){
  if(from === to) return;
  const p = pObj(prjId); if(!p) return;
  // Retour vers "À planifier" : suppression des affectations du trimestre d'origine
  if(to === null){
    const src = affs.filter(a=>a.prj===prjId && a.q===from);
    if(src.length && confirm(`Retirer « ${p.nom} » de ${from} (${src.length} affectation(s)) ?`))
      await act(src.map(a=>['RemoveRecord', T.AFF, a.id]));
    return;
  }
  // Première planification
  if(from === null){
    let grp = F.impacte || p.porteur, col = 0;
    if(F.collab){ col = F.collab; grp = (collabs.find(c=>c.id===col)||{}).grp || grp; }
    if(!grp){ alert("Ce projet n'a pas de groupement porteur : ouvrez sa fiche pour l'affecter."); return; }
    await act([addAff(prjId, grp, col, to, 'Faible')]);
    return;
  }
  // Déplacement ou copie entre trimestres
  const src = affs.filter(a=>a.prj===prjId && a.q===from);
  const actions = [];
  src.forEach(s => {
    const dup = affs.find(a=>a.prj===prjId && a.grp===s.grp && a.col===s.col && a.q===to);
    if(copy){ if(!dup) actions.push(addAff(prjId, s.grp, s.col, to, s.imp)); }
    else if(dup) actions.push(['RemoveRecord', T.AFF, s.id]);
    else actions.push(['UpdateRecord', T.AFF, s.id, {Trimestre:to}]);
  });
  await act(actions);
}
async function newProject(){
  const nom = prompt('Libellé du nouveau projet :');
  if(!nom || !nom.trim()) return;
  const r = await act([['AddRecord', T.PRJ, null, {Libelle_Projet:nom.trim(), Groupement_Porteur:F.porteur||0}]]);
  if(r && r.retValues) openModal(r.retValues[0]);
}

/* ================= Fiche projet (modale) ================= */
function openModal(id){ modalPrj = id; renderModal(); }
function closeModal(){ modalPrj = null; renderModal(); }
function renderModal(){
  const m = $('#modal');
  const p = modalPrj && pObj(modalPrj);
  if(!p){ m.innerHTML=''; modalPrj=null; return; }
  const pa = affs.filter(a=>a.prj===p.id);
  let h = `<div class="backdrop" id="bd"><div class="modal" role="dialog" aria-label="Fiche projet">
    <h2>Fiche projet</h2>
    <div class="row">
      <div class="fg" style="flex:1"><label>Libellé</label><input type="text" id="mNom" value="${esc(p.nom)}"></div>
      <div class="fg"><label>Groupement porteur</label><select id="mPorteur">${opts(grps, p.porteur, [0,'—'])}</select></div>
      <button class="primary" id="mSave">Enregistrer</button>
    </div>
    <h3>Impact par groupement</h3>
    <p class="hint" style="margin:0 0 6px">Clic sur une case : aucun → faible → fort → aucun (affectation du groupement entier).</p>
    <div style="overflow-x:auto"><table class="grid"><tr><th>Groupement</th>${QS.map(s=>`<th class="c">${s}</th>`).join('')}</tr>`;
  grps.forEach(g => {
    h += `<tr class="${g.id===p.porteur?'porteur-row':''}"><td>${esc(g.nom)}${g.id===p.porteur?' <span class="nom">(porteur)</span>':''}</td>`;
    Q.forEach((q,qi) => {
      const a = pa.find(x=>x.grp===g.id && !x.col && x.q===q);
      const nomi = pa.filter(x=>x.grp===g.id && x.col && x.q===q).length;
      h += `<td class="c cell" tabindex="0" data-g="${g.id}" data-qi="${qi}">
        ${a ? `<span class="chip ${esc(a.imp)}">${esc(a.imp||'?')}</span>` : ''}
        ${nomi ? `<span class="nom" title="Affectations nominatives">${nomi}👤</span>` : ''}</td>`;
    });
    h += `</tr>`;
  });
  h += `</table></div>`;

  h += `<h3>Affectations nominatives</h3>`;
  if(!hasCollab){
    h += `<p class="hint">Ajoutez la colonne <b>Collaborateur</b> (Référence → Collaborateur) dans la table Affectation pour activer cette section.</p>`;
  } else {
    const nom = pa.filter(a=>a.col).sort((x,y)=>x.q.localeCompare(y.q) || cName(x.col).localeCompare(cName(y.col),'fr'));
    h += nom.length ? `<table class="grid"><tr><th>Collaborateur</th><th>Groupement</th><th>Trimestre</th><th>Impact</th><th></th></tr>` +
      nom.map(a=>`<tr><td>${esc(cName(a.col))}</td><td>${esc(gName(a.grp))}</td><td>${esc(a.q)}</td>
        <td><button data-cyc="${a.id}">${esc(a.imp||'?')}</button></td>
        <td><button class="danger" data-del="${a.id}">Retirer</button></td></tr>`).join('') + `</table>`
      : `<p class="hint" style="margin:0">Aucune personne désignée nominativement.</p>`;
    h += `<div class="row" style="margin-top:8px">
      <div class="fg"><label>Collaborateur</label><select id="nCol">${collabs.map(c=>`<option value="${c.id}">${esc(c.nom)} (${esc(gName(c.grp))})</option>`).join('')}</select></div>
      <div class="fg"><label>Trimestre</label><select id="nQ">${Q.map(q=>`<option>${q}</option>`).join('')}</select></div>
      <div class="fg"><label>Impact</label><select id="nImp"><option>Faible</option><option>Fort</option></select></div>
      <button id="nAdd">Ajouter</button></div>`;
  }
  h += `<div class="row" style="justify-content:space-between; margin:16px 0 0">
      <button class="danger" id="mDel">Supprimer le projet</button>
      <button id="mClose">Fermer</button></div>
  </div></div>`;
  m.innerHTML = h;

  $('#bd').onclick = e => { if(e.target.id==='bd') closeModal(); };
  $('#mClose').onclick = closeModal;
  $('#mSave').onclick = () => act([['UpdateRecord', T.PRJ, p.id,
      {Libelle_Projet:$('#mNom').value.trim(), Groupement_Porteur:+$('#mPorteur').value}]]);
  $('#mDel').onclick = async () => {
    if(!confirm(`Supprimer « ${p.nom} » et ses ${pa.length} affectation(s) ?`)) return;
    modalPrj = null;
    await act([...pa.map(a=>['RemoveRecord', T.AFF, a.id]), ['RemoveRecord', T.PRJ, p.id]]);
  };
  m.querySelectorAll('.cell').forEach(td => {
    const cyc = () => {
      const g = +td.dataset.g, q = Q[+td.dataset.qi];
      const a = pa.find(x=>x.grp===g && !x.col && x.q===q);
      if(!a) act([addAff(p.id, g, 0, q, 'Faible')]);
      else if(a.imp==='Faible') act([['UpdateRecord', T.AFF, a.id, {Impact:'Fort'}]]);
      else act([['RemoveRecord', T.AFF, a.id]]);
    };
    td.onclick = cyc; td.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); cyc(); } };
  });
  m.querySelectorAll('[data-del]').forEach(b => b.onclick = () => act([['RemoveRecord', T.AFF, +b.dataset.del]]));
  m.querySelectorAll('[data-cyc]').forEach(b => b.onclick = () => {
    const a = affs.find(x=>x.id===+b.dataset.cyc);
    act([['UpdateRecord', T.AFF, a.id, {Impact: a.imp==='Fort' ? 'Faible' : 'Fort'}]]);
  });
  if($('#nAdd')) $('#nAdd').onclick = () => {
    const col = +$('#nCol').value, q = $('#nQ').value, imp = $('#nImp').value;
    const c = collabs.find(x=>x.id===col); if(!c) return;
    if(pa.some(a=>a.col===col && a.q===q)){ alert('Cette personne est déjà affectée sur ce trimestre.'); return; }
    act([addAff(p.id, c.grp, col, q, imp)]);
  };
}
document.addEventListener('keydown', e => { if(e.key==='Escape' && modalPrj) closeModal(); });

/* ================= Vue Charge ================= */
function viewCharge(){
  let h = `<div class="toolbar no-print"><button id="cPrint" onclick="window.print()">Imprimer</button>
    <span class="hint" style="margin:0">Points par trimestre (faible = 1, fort = 2), seuil ${seuil}.
    Vert &lt; 70 %, orange jusqu'au seuil, rouge au-delà.${hasCollab?' Clic sur un groupement : détail par personne (affectations nominatives).':''}</span></div>
    <div class="sheet"><h2>Charge des groupements — 2027</h2><div class="meta">Édité le ${today()} — seuil ${seuil} pts</div>
    <table class="grid"><tr><th>Groupement</th>${QS.map(s=>`<th class="c">${s}</th>`).join('')}<th class="c">Projets</th></tr>`;
  grps.forEach(g => {
    const open = chargeOpen.has(g.id);
    const nbPrj = new Set(affs.filter(a=>a.grp===g.id).map(a=>a.prj)).size;
    const members = collabs.filter(c=>c.grp===g.id);
    h += `<tr class="${hasCollab?'toggle':''}" data-g="${g.id}"><td>${hasCollab && members.length ? (open?'▾ ':'▸ '):''}<b>${esc(g.nom)}</b></td>`;
    Q.forEach(q => { const v = chargeGrp(g.id,q); h += `<td class="heat ${lvl(v)}">${v || '·'}</td>`; });
    h += `<td class="c">${nbPrj}</td></tr>`;
    if(hasCollab && open) members.forEach(c => {
      h += `<tr class="sub"><td>${esc(c.nom)}</td>`;
      Q.forEach(q => { const v = chargeCol(c.id,q); h += `<td class="heat ${lvl(v)}">${v || '·'}</td>`; });
      h += `<td class="c">${new Set(affs.filter(a=>a.col===c.id).map(a=>a.prj)).size}</td></tr>`;
    });
  });
  h += `</table></div>`;
  setTimeout(() => document.querySelectorAll('tr.toggle').forEach(tr => tr.onclick = () => {
    const g = +tr.dataset.g; chargeOpen.has(g) ? chargeOpen.delete(g) : chargeOpen.add(g); render();
  }));
  return h;
}

/* ================= États groupement / personne ================= */
function cellList(list, showNames){
  return list.map(a => {
    const who = a.col ? (showNames ? ` <span class="nom">${esc(cName(a.col))}</span>` : '') : (showNames ? ' <span class="nom">groupement</span>' : '');
    return `<div><span class="chip ${esc(a.imp)}">${esc(a.imp||'?')}</span>${who}</div>`;
  }).join('');
}
function sheetGroupement(g){
  const ga = affs.filter(a=>a.grp===g.id);
  const prjIds = [...new Set(ga.map(a=>a.prj))];
  const list = projets.filter(p=>prjIds.includes(p.id));
  let h = `<div class="sheet"><h2>État du groupement ${esc(g.nom)}</h2><div class="meta">Planning 2027 — édité le ${today()}</div>`;
  if(!list.length) h += `<p class="empty">Aucun projet n'impacte ce groupement.</p>`;
  else {
    h += `<table class="grid"><tr><th>Projet</th><th>Porteur</th>${QS.map(s=>`<th>${s}</th>`).join('')}</tr>`;
    list.forEach(p => {
      h += `<tr><td>${esc(p.nom)}</td><td>${esc(gName(p.porteur))}</td>`;
      Q.forEach(q => h += `<td>${cellList(ga.filter(a=>a.prj===p.id && a.q===q), hasCollab)}</td>`);
      h += `</tr>`;
    });
    h += `<tr><th colspan="2">Charge (seuil ${seuil})</th>${Q.map(q=>{const v=chargeGrp(g.id,q);return `<td class="heat ${lvl(v)}">${v} pts</td>`;}).join('')}</tr></table>`;
  }
  const portes = projets.filter(p=>p.porteur===g.id);
  if(portes.length) h += `<h3>Projets portés (${portes.length})</h3><p style="margin:0">${portes.map(p=>{
      const qs = QS.filter((s,i)=>affs.some(a=>a.prj===p.id && a.q===Q[i]));
      return `${esc(p.nom)} <span class="nom">(${qs.length?qs.join(', '):'non planifié'})</span>`; }).join(' ; ')}</p>`;
  return h + `<p class="legend">Faible = 1 pt, Fort = 2 pts. La charge du groupement inclut ses affectations nominatives.</p></div>`;
}
function sheetCollab(c){
  const own = affs.filter(a=>a.col===c.id);
  const via = affs.filter(a=>a.grp===c.grp && !a.col);
  const prjIds = [...new Set([...own,...via].map(a=>a.prj))];
  const list = projets.filter(p=>prjIds.includes(p.id));
  let h = `<div class="sheet"><h2>État de ${esc(c.nom)}</h2><div class="meta">Groupement ${esc(gName(c.grp))} — planning 2027 — édité le ${today()}</div>`;
  if(!list.length) return h + `<p class="empty">Aucun projet ne concerne cette personne.</p></div>`;
  h += `<table class="grid"><tr><th>Projet</th><th>Porteur</th>${QS.map(s=>`<th>${s}</th>`).join('')}</tr>`;
  list.forEach(p => {
    h += `<tr><td>${esc(p.nom)}</td><td>${esc(gName(p.porteur))}</td>`;
    Q.forEach(q => {
      const o = own.filter(a=>a.prj===p.id && a.q===q), v = via.filter(a=>a.prj===p.id && a.q===q);
      h += `<td>${cellList(o,false)}${v.map(a=>`<div class="via"><span class="chip ${esc(a.imp)}">${esc(a.imp||'?')}</span> <span class="nom">via groupement</span></div>`).join('')}</td>`;
    });
    h += `</tr>`;
  });
  h += `<tr><th colspan="2">Charge personnelle (seuil ${seuil})</th>${Q.map(q=>{const v=chargeCol(c.id,q);return `<td class="heat ${lvl(v)}">${v} pts</td>`;}).join('')}</tr></table>`;
  return h + `<p class="legend">La charge personnelle ne compte que les affectations nominatives. Les lignes « via groupement » concernent tout le groupement.</p></div>`;
}
function viewEtat(){
  const canCol = hasCollab;
  if(!canCol) E.type = 'grp';
  const list = E.type==='grp' ? grps : collabs;
  let h = `<div class="toolbar no-print">
    <div class="fg"><label>Type d'état</label><select id="eType">
      <option value="grp" ${E.type==='grp'?'selected':''}>Par groupement</option>
      ${canCol?`<option value="col" ${E.type==='col'?'selected':''}>Par personne</option>`:''}</select></div>
    <div class="fg"><label>${E.type==='grp'?'Groupement':'Collaborateur'}</label>
      <select id="eId">${opts(list, E.id, ['all','Tous (une page chacun)'])}</select></div>
    <button class="primary" onclick="window.print()">Imprimer / PDF</button></div>`;
  const sel = E.id==='all' ? list : list.filter(x=>x.id==E.id);
  h += sel.map(x => E.type==='grp' ? sheetGroupement(x) : sheetCollab(x)).join('');
  setTimeout(() => {
    $('#eType').onchange = e => { E.type = e.target.value; E.id = 'all'; render(); };
    $('#eId').onchange = e => { E.id = e.target.value==='all' ? 'all' : +e.target.value; render(); };
  });
  return h;
}

/* ================= État par projet ================= */
function sheetProjet(p){
  const pa = affs.filter(a=>a.prj===p.id);
  const gIds = [...new Set(pa.map(a=>a.grp))];
  const list = grps.filter(g=>gIds.includes(g.id));
  let h = `<div class="sheet" style="--suit:${gColor(p.porteur)}"><h2>${esc(p.nom)}</h2>
    <div class="meta">Porteur : <span class="suit">${esc(gName(p.porteur))}</span> — édité le ${today()}</div>`;
  if(!list.length) return h + `<p class="empty">Projet non planifié.</p></div>`;
  h += `<table class="grid"><tr><th>Groupement impacté</th>${QS.map(s=>`<th>${s}</th>`).join('')}</tr>`;
  list.forEach(g => {
    h += `<tr><td>${esc(g.nom)}</td>`;
    Q.forEach(q => h += `<td>${cellList(pa.filter(a=>a.grp===g.id && a.q===q), hasCollab)}</td>`);
    h += `</tr>`;
  });
  h += `<tr><th>Points du projet</th>${Q.map(q=>`<td class="c"><b>${sum(pa.filter(a=>a.q===q))}</b></td>`).join('')}</tr></table></div>`;
  return h;
}
function viewEtatProjet(){
  let h = `<div class="toolbar no-print">
    <div class="fg"><label>Projet</label><select id="pSel">${opts(projets, E.prj, ['all','Tous (une page chacun)'])}</select></div>
    <button class="primary" onclick="window.print()">Imprimer / PDF</button></div>`;
  const sel = E.prj==='all' ? projets : projets.filter(p=>p.id==E.prj);
  h += sel.length ? sel.map(sheetProjet).join('') : `<p class="empty">Aucun projet. Créez-en un depuis le Kanban.</p>`;
  setTimeout(() => $('#pSel').onchange = e => { E.prj = e.target.value==='all' ? 'all' : +e.target.value; render(); });
  return h;
}

loadAll();
</script>
