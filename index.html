<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Planning projets 2027</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root{
    --table:#2a2d33; --table-dark:#3a3e46; --red:#b42318; --red-bg:#fde7e5;
    --paper:#ffffff; --ink:#2a2d33; --muted:#6f6a63;
    --line:#e2ddd5; --col:#eeebe6; --bg:#f7f5f2; --soft:#f1efeb;
    --ok:#2e7d4f; --ok-bg:#dff1e6; --warn:#a86a00; --warn-bg:#fbeccb; --over:#b3261e; --over-bg:#f8dcd9;
  }
  *{box-sizing:border-box;}
  body{font-family:"Segoe UI",Tahoma,Helvetica,Arial,sans-serif; margin:0; color:var(--ink); background:var(--bg); font-size:13px;}
  header{background:var(--table); color:#fff; border-bottom:3px solid var(--red); padding:10px 14px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  header h1{font-size:16px; margin:0 12px 0 0; font-weight:600;}
  .tabs{display:flex; gap:4px; flex-wrap:wrap;}
  .tab{background:transparent; color:#d6d3cd; border:1px solid transparent; padding:6px 11px; border-radius:6px; cursor:pointer; font:inherit;}
  .tab:hover{background:var(--table-dark);}
  .tab.on{background:var(--red); color:#fff; font-weight:600;}
  .hright{margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12px;}
  
  main{padding:14px;}
  select,button,input[type=text]{font:inherit; padding:6px 9px; border-radius:6px; border:1px solid #d3cdc3; background:#fff; color:var(--ink);}
  button{cursor:pointer;} button:hover{background:var(--soft);}
  button.primary{background:var(--table); color:#fff; border-color:var(--table);} button.primary:hover{background:var(--table-dark);}
  button.danger{color:var(--over); border-color:#e1b3ae;}
  button:focus-visible,select:focus-visible,.card:focus-visible,.cell:focus-visible{outline:2px solid var(--red); outline-offset:1px;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;}
  .fg{display:flex; flex-direction:column; gap:3px;} .fg label{font-size:11px; color:var(--muted);}
  .status{padding:8px 14px; color:var(--muted);} .status.err{color:var(--over);}
  .hint{font-size:11px; color:var(--muted); margin:8px 0 0;}

  /* Kanban */
  .board{display:grid; grid-template-columns:minmax(170px,.8fr) repeat(4,minmax(0,1fr)); gap:10px; align-items:stretch; min-height:320px;}
  .board.todo-closed{grid-template-columns:44px repeat(4,minmax(0,1fr));}
  .col{background:var(--col); border-radius:10px; padding:0 8px 8px; min-height:320px; border:2px dashed transparent; overflow-y:auto; overflow-x:hidden;}
  .col.closed{padding:0; cursor:pointer;}
  .col.closed .vlab{writing-mode:vertical-rl; transform:rotate(180deg); font-weight:600; font-size:13px; color:var(--table); padding:10px 0; margin:0 auto; white-space:nowrap;}
  .col-head .subtab{font-size:11px; padding:3px 7px; white-space:nowrap;}
  .colbtn{border:0; background:transparent; padding:0 4px; font-size:12px; color:var(--muted);}
  .card .tag[data-tg]{cursor:pointer;} .card .tag[data-tg]:hover{box-shadow:inset 0 0 0 1px #6f6a63;}
  .card:focus-visible{outline:2px solid var(--red); outline-offset:2px;}
  .card.compact .banner{padding-top:4px;} .card.compact .body{padding:2px 9px 6px;} .card.compact .t{margin:0; font-size:12px;}
  .ktools{display:flex; gap:8px; align-items:center;} .ktools label.ck{font-size:12px; display:flex; gap:4px; align-items:center; color:var(--ink);}
  @media print{ .board{height:auto !important;} .col{overflow:visible;} }
  .col.todo{background:#e6e1d9;}
  .col.over{border-color:var(--red);}
  .col-head{display:flex; justify-content:space-between; align-items:baseline; gap:6px; position:sticky; top:0; z-index:2; background:inherit; padding:8px 0 8px; margin-bottom:0;}
  .col-head b{font-size:14px; color:var(--table);} .col-head .n{font-size:11px; color:var(--muted);}
  .gauge{height:6px; background:#fff; border-radius:3px; overflow:hidden; margin:-2px 0 8px;}
  .gauge i{display:block; height:100%;}
  .gauge-lbl{font-size:11px; margin:-4px 0 8px;}
  .card{background:var(--paper); border-radius:0 6px 6px 0; padding:0; margin-bottom:8px; cursor:grab; position:relative; overflow:hidden;
        border-left:5px solid var(--suit); box-shadow:0 1px 2px rgba(42,45,51,.10);}
  .card:hover{box-shadow:0 2px 6px rgba(42,45,51,.16);}
  .banner{color:var(--suit); padding:6px 9px 0; font-size:11px; font-weight:600; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .banner .flag{font-size:10px;} .banner .who{font-weight:400; color:var(--muted);}
  .card .body{padding:4px 9px 8px;}
  .k{font-size:10px; color:var(--muted); margin:6px 0 3px;}
  .card:active{cursor:grabbing;}
  .card .t{font-weight:600; margin-bottom:5px; line-height:1.25;}
  .suit{display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:10px; color:#fff; background:var(--suit);}
  .chips{display:flex; flex-wrap:wrap; gap:4px;}
  .tag{font-size:10px; padding:2px 6px; border-radius:4px; background:var(--soft); color:#44403c; white-space:nowrap;}
  .tag b.Fort{color:var(--red);} .tag b.Faible{color:var(--warn);}
  .tag.hl{box-shadow:inset 0 0 0 1px #9a938a; font-weight:600;}
  .chip{font-size:10px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); background:#fff; white-space:nowrap;}
  .chip.Fort{border-color:#e1b3ae; background:var(--over-bg); color:var(--over); font-weight:600;}
  .chip.Faible{border-color:#e8d3a4; background:var(--warn-bg); color:var(--warn);}
  .empty{font-size:12px; color:var(--muted); padding:6px 2px;}

  /* Modal */
  .backdrop{position:fixed; inset:0; background:rgba(20,30,25,.45); display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow:auto; z-index:10;}
  .modal{background:#fff; border-radius:10px; width:min(860px,100%); padding:16px 18px; box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .modal h2{margin:0 0 12px; font-size:16px;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:12px;}
  .row input[type=text]{min-width:260px; flex:1;}
  h3{font-size:13px; margin:16px 0 6px;}

  /* Grilles */
  table.grid{border-collapse:collapse; width:100%; background:#fff;}
  table.grid.fixed{table-layout:fixed;} table.grid.fixed td{overflow-wrap:anywhere;}
  .grid th,.grid td{border:1px solid var(--line); padding:5px 7px; text-align:left; vertical-align:top;}
  .grid th{background:var(--soft); font-weight:600; font-size:12px;}
  .grid td.c{text-align:center; vertical-align:middle;}
  .cell{cursor:pointer; min-width:70px; height:30px; user-select:none;}
  .cell:hover{background:#f4f3ee;}
  .porteur-row td:first-child{font-weight:600;}
  .heat{font-weight:600; text-align:center; min-width:90px;}
  .lvl-0{background:#fff; color:var(--muted);}
  .lvl-n{background:#f3ece4; color:var(--ink);}
  .lvl-ok{background:var(--ok-bg); color:var(--ok);}
  .lvl-warn{background:var(--warn-bg); color:var(--warn);}
  .lvl-over{background:var(--over-bg); color:var(--over);}
  .heat .occ{display:block; font-size:10px; font-weight:400;}
  .quo{background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:12px;}
  .quo .row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .quo input[type=number]{width:80px; font:inherit; padding:6px 9px; border-radius:6px; border:1px solid #d3cdc3;}
  .quo .qerr{color:var(--over); font-size:12px; margin-top:6px;}
  .sub td{font-size:12px; background:#fafaf7;}
  .sub td:first-child{padding-left:22px;}
  .toggle{cursor:pointer;}
  .nom{font-size:11px; color:var(--muted);}
  .via{opacity:.65; font-style:italic;}

  /* Etats imprimables */
  .sheet{background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-bottom:14px;}
  .sheet h2{margin:0 0 2px; font-size:17px;}
  .sheet .meta{color:var(--muted); font-size:11px; margin-bottom:10px;}
  .legend{font-size:11px; color:var(--muted); margin-top:8px;}
  @media print{
    @page{size:A4 landscape; margin:10mm;}
    body{background:#fff;}
    header,.no-print,.status,#smov{display:none !important;}
    main{padding:0;}
    .sheet{border:0; padding:0; margin:0; page-break-after:always;}
    .sheet:last-child{page-break-after:auto;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
  .badge{font-size:10px; font-weight:600; padding:1px 6px; border-radius:4px; white-space:nowrap;}
  .banner .badge{margin-left:auto;}
  .banner .badge + .badge{margin-left:0;}
  .b-P1{background:#fde7e5; color:#b42318;}           /* rouge */
  .b-P2{background:#ffe6d0; color:#b54708;}           /* orange */
  .b-P3{background:#fff4b8; color:#7a5d00;}           /* jaune (texte foncé pour la lisibilité) */
  .b-Poursuite{background:#efe6fb; color:#6b3fa0;}    /* violet */
  .badge.dd{background:var(--red); color:#fff;}
  
  .gantt{border-collapse:collapse; width:100%; table-layout:fixed; background:#fff;}
  .gantt th,.gantt td{padding:4px 6px; font-size:12px; vertical-align:middle;}
  .gantt th{background:var(--soft); text-align:center; border-bottom:1px solid var(--line);}
  .gantt th.lft{text-align:left;}
  .gantt tr.prow td{border-bottom:1px solid #eeece5;}
  .gantt td.q{border-left:1px dashed #e0ddd3; padding:3px 0;}
  .gantt td.q{vertical-align:top;}
  .gantt .bar{margin-left:-1px; height:8px;}
  .gantt .gchips{display:flex; flex-wrap:wrap; gap:3px; padding:4px 5px 2px;}
  .gchip{font-size:10px; padding:1px 6px; border-radius:9px; background:var(--soft); color:#44403c; white-space:nowrap; border:1px solid var(--line);}
  .gchip b.Fort{color:var(--red);} .gchip b.Faible{color:var(--warn); font-weight:600;}
  .gchip .nm{color:var(--muted);}
  .gchip .cbub{margin-left:3px;}
  .gchip.open{box-shadow:inset 0 0 0 1px #e0b93a;}
  .gcom{flex-basis:100%; font-size:11px; font-style:italic; color:#4a4f55; background:#fff8e1; border:1px solid #f0d58a;
        border-radius:6px; padding:4px 6px; white-space:pre-wrap;}
  .gantt .bar.first{border-radius:4px 0 0 4px; margin-left:4px;} .gantt .bar.last{border-radius:0 4px 4px 0; margin-right:4px;}
  .gantt .pn{font-weight:600;} .gantt .pm{font-size:10px; color:var(--muted);}
  .grp-band td{background:var(--suit); color:#fff; font-weight:600; padding:5px 8px;}
  .cbtn{border:1px solid #e0b93a; background:#ffe08a; padding:0 5px; margin-left:3px; border-radius:9px; cursor:pointer; font-size:12px; line-height:18px;}
  .cbtn:hover{background:#ffd24d;}
  .cbtn.vide{background:#fff; border:1px dashed #b9b2a6; opacity:.8;}
  .cbtn.vide:hover{opacity:1; background:var(--soft);}
  .cbub{display:inline-block; margin-left:4px; padding:0 4px; border-radius:8px; background:#ffe08a; border:1px solid #e0b93a;
        font-size:11px; line-height:14px; cursor:pointer;}
  .cbub:hover{background:#ffd24d;}
  .cbub.vide{background:#fff; border:1px dashed #b9b2a6; opacity:.75;}
  .cbub.vide:hover{opacity:1; background:var(--soft);}
  .com{font-size:11px; color:#4a4f55; font-style:italic; margin:2px 0 4px; white-space:pre-wrap;}
  .com-edit{background:#f6f5f0; border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:10px;}
  .jr{list-style:none; margin:6px 0 8px; padding:0; max-height:220px; overflow:auto;}
  .jr li{background:#fff; border:1px solid var(--line); border-radius:6px; padding:5px 8px; margin-bottom:4px;}
  .jr .ja{font-size:11px; color:var(--muted); margin-bottom:2px;} .jr .ja b{color:var(--ink);}
  .jr .jt{white-space:pre-wrap;}
  .com-edit textarea{width:100%; min-height:70px; font:inherit; padding:6px; border-radius:6px; border:1px solid #bdb9ad;}
  #lock.on{background:var(--red); color:#fff; border-color:var(--red);}
  .admin{border-color:var(--red); color:var(--red);}
  .prof-list{display:flex; flex-direction:column; gap:6px; margin:10px 0;}
  .prof-list button{text-align:left; padding:8px 10px;}
  .prof-list .sep{border-top:1px solid var(--line); margin:4px 0;}
  #profilBtn{background:transparent; color:#fff; border-color:#6b6f78;}
  #profilBtn:hover{background:var(--table-dark);}
  .pwdbox{background:#fff; border-radius:10px; width:min(380px,100%); padding:16px 18px; box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .pwdbox input{width:100%; font:inherit; padding:7px 9px; border-radius:6px; border:1px solid #d3cdc3; margin:4px 0 8px;}
  .pwdbox .err{color:var(--red); font-size:12px; min-height:16px; margin:0 0 6px;}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:12px;}
  .kpi{background:var(--soft); border-radius:8px; padding:8px 10px;}
  .kpi p{margin:0; font-size:11px; color:var(--muted);} .kpi b{font-size:22px;}
  .brow{display:grid; grid-template-columns:90px 1fr 50px; gap:8px; align-items:center; font-size:12px; margin-bottom:5px;}
  .sbar{height:12px; border-radius:3px; display:flex; overflow:hidden; background:var(--soft);}
  .sbar i{display:block; height:100%;}
  .bk{font-size:10px; font-weight:600; padding:2px 7px; border-radius:4px; white-space:nowrap; display:inline-block;}
  .bk-ok{background:#dff1e6; color:#2e7d4f;} .bk-lt{background:#fbeccb; color:#8a5a00;}
  .bk-ko{background:var(--red-bg); color:var(--red);} .bk-ad{background:#e3ecf7; color:#2f5d8a;}
  .bk-rt{background:var(--soft); color:#57534e;} .bk-ab{background:#efe6fb; color:#6b3fa0;}
  .bk-av{background:#fff; color:var(--muted); border:1px solid var(--line);}
  .rp{font-size:10px; color:var(--warn); display:block;}
  .subtabs{display:flex; gap:4px; margin-bottom:10px;}
  .subtab{border-radius:6px; padding:5px 11px; background:#fff;}
  .subtab.on{background:var(--table); color:#fff; border-color:var(--table);}
  .vehelp-wrap{position:relative;}
  .vana{background:#fff; border:1px solid var(--line); border-left:4px solid #2f5d8a; border-radius:0 8px 8px 0; padding:12px 16px; margin:10px 0 12px; line-height:1.5;}
  .vana > b{font-size:14px;}
  .vana h4{margin:10px 0 3px; font-size:13px; color:#2f5d8a;}
  .vana p{margin:0; font-size:12px;}
  .vana table{border-collapse:collapse; font-size:12px; margin-top:4px;}
  .vana td,.vana th{border:1px solid var(--line); padding:3px 10px; text-align:center;}
  .vana th{background:var(--soft); font-weight:600;}
  #vAna.on{background:var(--table); color:#fff; border-color:var(--table);}
  .vehelp-btn{width:26px; height:26px; padding:0; border-radius:50%; font-weight:600; margin-left:6px;}
  .vehelp-btn.on{background:var(--table); color:#fff; border-color:var(--table);}
  .vehelp{position:absolute; top:40px; left:0; width:min(560px,100%); background:#fff; border:1px solid #d3cdc3; border-radius:10px; padding:14px 16px; z-index:20; line-height:1.5; box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .vehelp:before{content:""; position:absolute; top:-7px; left:var(--ax,20px); width:12px; height:12px; background:#fff; border-left:1px solid #d3cdc3; border-top:1px solid #d3cdc3; transform:rotate(45deg);}
  .vehelp .vh-top{display:flex; justify-content:space-between; align-items:center;}
  .vehelp .vh-top b{font-size:14px;}
  .vehelp .vh-x{border:0; padding:2px 6px; font-size:16px; background:transparent;}
  .vehelp h4{margin:10px 0 2px; font-size:13px; color:var(--red);}
  .vehelp p{margin:0; font-size:12px;}
  .vehelp .q{display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; margin:2px 2px 0 0;}
  .vehelp .vh-ex{margin-top:10px; padding:8px 10px; background:var(--soft); border-radius:6px;}
  .qgrid{display:grid; grid-template-columns:24px 1fr 1fr; grid-template-rows:auto 1fr 1fr; gap:8px;}
  .qax{font-size:11px; color:var(--muted); text-align:center; align-self:end;}
  .qay{font-size:11px; color:var(--muted); writing-mode:vertical-rl; transform:rotate(180deg); text-align:center; align-self:center;}
  .qz{border-radius:10px; padding:8px; min-height:170px; border:2px dashed transparent;}
  .qz.over{border-color:var(--table);}
  .qz h4{margin:0; font-size:13px;} .qz .qs{font-size:11px; margin:0 0 8px; opacity:.8;}
  .q1{background:#e3f3ea; color:#1f5e3d;} .q2{background:#e3ecf7; color:#244a73;}
  .q3{background:#fbf0d8; color:#6e4a00;} .q4{background:#f6e2e0; color:#7d1f17;}
  .vcard{background:#fff; color:var(--ink); border-left:4px solid var(--suit); border-radius:0 6px 6px 0; padding:5px 8px; margin-bottom:5px;
         cursor:pointer; box-shadow:0 1px 2px rgba(42,45,51,.1); font-size:12px;}
  .vcard .vt{font-weight:600; line-height:1.25;} .vcard .vm{font-size:10px; color:var(--muted); margin-top:2px;}
  .vpill{font-size:10px; font-weight:600; padding:1px 6px; border-radius:4px; background:var(--soft); white-space:nowrap;}
  .qb{font-size:10px; font-weight:600; padding:2px 7px; border-radius:4px; white-space:nowrap;}
  .rend{display:flex; align-items:center; gap:6px;} .rend i{display:block; height:10px; border-radius:2px;}
  .vbtns{display:flex; gap:6px; margin:8px 0;} .vbtns button{min-width:44px; font-weight:600;}
  .vbtns button.on{background:var(--table); color:#fff; border-color:var(--table);}
  svg.scatter text{font-family:inherit;}
  svg.scatter .pt{cursor:pointer;} svg.scatter .pt:hover circle{stroke:var(--ink); stroke-width:2;}
  .fresque{min-width:760px; padding-right:22px;}
  .fhead,.frow{display:grid; grid-template-columns:150px 1fr;}
  .fq{display:grid; grid-template-columns:repeat(4,1fr);} .fq div{text-align:center; font-size:11px; font-weight:600; background:var(--soft); padding:4px 0; border-left:1px solid var(--line);}
  .fm{display:grid; grid-template-columns:repeat(12,1fr);} .fm div{text-align:center; font-size:10px; color:var(--muted); padding:2px 0; border-left:1px dashed var(--line);}
  .frow{border-top:1px solid var(--line);}
  .flab{font-size:12px; font-weight:600; padding:6px 8px 6px 0; display:flex; gap:6px; align-items:flex-start; line-height:1.25;}
  .flab i{flex:0 0 9px; height:9px; border-radius:2px; margin-top:3px;}
  .flab .nom{font-weight:400; display:block;}
  .ftrack{position:relative; background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%);}
  .fbar{position:absolute; height:18px; border-radius:9px; font-size:10px; line-height:18px; padding:0 8px; white-space:nowrap; overflow:hidden;
        text-overflow:ellipsis; color:#fff; cursor:pointer; box-sizing:border-box;}
  .fbar.Faible{color:var(--ink);} .fbar.sel{outline:2px solid var(--ink); outline-offset:1px;}
  .fms{position:absolute; font-size:9px; color:var(--muted); transform:translateX(-50%); white-space:nowrap; text-align:center; line-height:1;}
  .fms b{display:block; width:8px; height:8px; margin:0 auto 1px; transform:rotate(45deg); background:var(--red);}
  .fms.ref b{background:#fff; border:1.5px solid #6f6a63;} .fms.ref{color:#6f6a63;} .fms.late{color:var(--red); font-weight:600;}
  .ftoday{position:absolute; top:0; bottom:0; width:2px; background:var(--red); opacity:.7;}
  .fdet{background:#fff8e1; border:1px solid #f0d58a; border-radius:8px; padding:8px 10px; margin:10px 0 0; font-size:12px;}
  .fdet h4{margin:0 0 4px; font-size:13px;}
  #smbar{background:var(--red); color:#fff; padding:6px 14px; font-size:13px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  #smbar b{font-size:15px;} #smbar .cd{font-variant-numeric:tabular-nums; font-size:18px; font-weight:700;}
  #smbar button{padding:3px 9px; font-size:12px;}
  .smov{position:fixed; inset:0; background:rgba(20,22,26,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .smbox{background:#fff; border-radius:14px; padding:28px 32px; width:min(620px,100%); text-align:center; border-top:8px solid var(--red);}
  .smbox .tr{display:inline-block; font-size:13px; padding:3px 12px; border-radius:12px; background:var(--red-bg); color:var(--red); font-weight:600;}
  .smbox h2{font-size:34px; margin:14px 0 6px;} .smbox p{font-size:20px; margin:4px 0; color:var(--muted);}
  .smbox p b{color:var(--ink);} .smbox .big{font-size:26px; color:var(--ink); margin:12px 0;}

  .smgrid td.bad{background:var(--red-bg); color:var(--red); font-weight:700;} .smgrid td.dup{box-shadow:inset 0 0 0 2px #e0a526;}

  @media (max-width:900px){ .board{grid-template-columns:1fr 1fr;} }

<body>

    <button class="tab" data-v="kanban">Kanban</button>

<main id="app"></main>
<div id="modal"></div>
<div id="pwd"></div>
<div id="profil"></div>
<div id="smov"></div>
<div id="vedit"></div>

<script>
/* ================= Configuration ================= */
const T = { GRP:'Groupement', COL:'Collaborateur', PRJ:'Projet', AFF:'Affectation' };
const T_QUO = 'Quotidien';                        // facultative : Groupement (réf.), Trimestre (texte), Pourcentage
const PT_PCT = 5;                                  // 1 point d'impact ≈ 5 % du temps d'un groupement sur un trimestre
const OCC_ORANGE = 80, OCC_ROUGE = 100;            // occupation : vert < 80 %, orange 80–100 %, rouge > 100 %
const T_COM = 'Commentaires';                     // journal : Affectation (réf.), Texte, Auteur, Date
const Q = ['T1 - 2027','T2 - 2027','T3 - 2027','T4 - 2027'];
const QS = ['T1','T2','T3','T4'];                 // libellés courts
const POIDS = { Faible:1, Fort:2 };
const PRIOS = ['P1','P2','P3','Poursuite'];         // ordre de tri
const DD_VAL = 'Roadmap DDSIS';
const USE_SEUIL = false;                           // seuil de charge désactivé pour l'instant
const SEUIL_DEFAUT = 6;
const REFRESH_MS = 30000;                          // rafraîchissement automatique (ms)                            // points par trimestre
const PALETTE = ['#2f5d8a','#9b2c2c','#2e7d5b','#6b4fa0','#b3621b','#1f7a7a','#7a5230',
                 '#a33a6b','#44607f','#5b7f2e','#8a6d1f','#5a4e8c','#1b6f8f','#8b5e4a'];

/* ================= État ================= */
let grps=[], collabs=[], projets=[], affs=[], hasCollab=false, hasPrjCollab=false, hasPrio=false, hasDD=false, hasCom=false, hasJournal=false, journal=[];
let seuil = SEUIL_DEFAUT;
let hasQuo = false, quot = {};                     // quot[grp][trimestre] = {id, v}
const QU = { grp:0, draft:null, err:'', help:false }; // saisie du quotidien (onglet Charge)
let view = 'kanban';
const F = { grp:0, col:0, prio:'', dd:'', txt:'' };  // filtres kanban : groupement, collaborateur
let modalPrj = null;                                // id projet ouvert
let chargeOpen = new Set();
const E = { type:'grp', id:'all', prj:'all' };      // sélection des états
let loadSeq = 0;
let pending = 0;                                    // écritures en cours (affichage anticipé)
const K = { sort:'prio', compact:false, todoOpen:true, focus:'', view:'std', pg:0, ig:0, ic:0, pool:'todo' };   // options du kanban
let lastSig = '';                                   // signature des données affichées
let dragging = false;
let comEdit = null;                                 // id d'affectation dont le commentaire est en cours d'édition
const P = { mode:'porteur', g:'all', open:new Set(), sub:'tableau', org:'grp', jal:'fin', sel:'' }; // open : commentaires dépliés              // options P2A
const S = { type:'prio', val:'all', open:new Set() }; // open : commentaires dépliés               // état priorité / DDSIS

/* ================= Utilitaires ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Index (reconstruits après chaque chargement ou modification locale)
const IDX = { g:new Map(), c:new Map(), p:new Map(), a:new Map() };
function reindex(){
  IDX.g = new Map(grps.map(x => [x.id, x]));
  IDX.c = new Map(collabs.map(x => [x.id, x]));
  IDX.p = new Map(projets.map(x => [x.id, x]));
  IDX.a = new Map();
  affs.forEach(a => { let l = IDX.a.get(a.prj); if(!l) IDX.a.set(a.prj, l = []); l.push(a); });
}
const affsOf = prj => IDX.a.get(prj) || [];
const gName = id => (IDX.g.get(id)||{}).nom || '—';
const cName = id => (IDX.c.get(id)||{}).nom || '—';
const pObj  = id => IDX.p.get(id);
const porteurTxt = p => esc(gName(p.porteur)) + (p.pcol ? ` <span class="nom">(${esc(cName(p.pcol))})</span>` : '');
const norm = v => String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const matchTxt = p => !F.txt || norm(p.nom).includes(norm(F.txt));
const matchPD = p => matchTxt(p) && (!F.prio || (F.prio==='__none' ? !p.prio : p.prio===F.prio)) && (!F.dd || (F.dd==='oui') === p.dd);
// « À planifier » : projets dont le groupement / collaborateur filtré est porteur
const matchPorteur = p => (!F.grp || p.porteur===F.grp) && (!F.col || p.pcol===F.col) && matchPD(p);
const prioRank = p => { const i = PRIOS.indexOf(p.prio); return i<0 ? 99 : i; };
const byPrio = (a,b) => prioRank(a)-prioRank(b) || a.nom.localeCompare(b.nom,'fr');
const prioBadge = p => p.prio ? `<span class="badge b-${esc(p.prio)}">${esc(p.prio)}</span>` : '';
const ddBadge = p => '';                            // Roadmap DDSIS : jamais affichée (état protégé uniquement)
function txtFilter(){
  return `<div class="fg"><label>Intitulé du projet</label>
    <input type="text" id="fTxt" placeholder="Mot du libellé" value="${esc(F.txt)}" style="min-width:180px"></div>`;
}
function pdFilters(){
  return txtFilter() + (hasPrio ? `<div class="fg"><label>Priorité</label><select id="fPrio">
      <option value="">Toutes</option>${PRIOS.map(v=>`<option ${F.prio===v?'selected':''}>${v}</option>`).join('')}
      <option value="__none" ${F.prio==='__none'?'selected':''}>Sans priorité</option></select></div>` : '')
   + (false ? `<div class="fg"><label>Roadmap DDSIS</label><select id="fDD">
      <option value="">Tous</option><option value="oui" ${F.dd==='oui'?'selected':''}>Oui</option>
      <option value="non" ${F.dd==='non'?'selected':''}>Non</option></select></div>` : '');
}
function bindPD(){
  const t = $('#fTxt');
  if(t) t.oninput = () => {
    const pos = t.selectionStart;
    F.txt = t.value; render();
    const n = $('#fTxt'); if(n){ n.focus(); n.setSelectionRange(pos, pos); }
  };
  if($('#fPrio')) $('#fPrio').onchange = e => { F.prio = e.target.value; render(); };
  if($('#fDD')) $('#fDD').onchange = e => { F.dd = e.target.value; render(); };
}
const gColor = id => { const i = grps.findIndex(g=>g.id===id); return i<0 ? '#8a8a8a' : PALETTE[i % PALETTE.length]; };
const pts = a => POIDS[a.imp] || 0;
const sum = arr => arr.reduce((s,a)=>s+pts(a),0);
const chargeGrp = (g,q) => sum(affs.filter(a=>a.grp===g && a.q===q));
const chargeCol = (c,q) => sum(affs.filter(a=>a.col===c && a.q===q));
const lvl = v => v<=0 ? 'lvl-0' : !USE_SEUIL ? 'lvl-n' : v/seuil < .7 ? 'lvl-ok' : v<=seuil ? 'lvl-warn' : 'lvl-over';
// Occupation d'un groupement sur un trimestre : null si le quotidien n'est pas saisi
const quotOf = (g,q) => (quot[g] && quot[g][q]) ? quot[g][q].v : null;
const occGrp = (g,q) => { const qv = quotOf(g,q); return qv === null ? null : qv + chargeGrp(g,q) * PT_PCT; };
const lvlOcc = o => o < OCC_ORANGE ? 'lvl-ok' : o <= OCC_ROUGE ? 'lvl-warn' : 'lvl-over';
const lvlColor = v => ({'lvl-0':'#cfcfcf','lvl-ok':'var(--ok)','lvl-warn':'var(--warn)','lvl-over':'var(--over)'})[lvl(v)];
const fmtDate = v => {
  if(v === null || v === undefined || v === '') return '—';
  if(typeof v === 'number') return new Date(v*1000).toLocaleDateString('fr-FR');   // date seule
  return String(v);
};
// Actions de suppression d'affectations (+ entrées de journal liées)
const rmAffs = list => list.flatMap(a => [...(a.jr||[]).map(e=>['RemoveRecord', T_COM, e.id]), ['RemoveRecord', T.AFF, a.id]]);
const comHtml = a => a.com ? `<div class="com">💬 ${esc(a.com)}</div>` : '';
const confirmCom = list => { const c = list.filter(a=>a.com); return !c.length ||
  confirm(`Cette suppression efface aussi ${c.length>1?'les commentaires':'le commentaire'} :\n\n${c.map(a=>'• '+a.com).join('\n')}\n\nContinuer ?`); };
const today = () => new Date().toLocaleDateString('fr-FR');
const opts = (list, sel, all) => (all ? `<option value="${all[0]}">${esc(all[1])}</option>` : '') +
  list.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.nom)}</option>`).join('');
function setStatus(msg, err){ const s=$('#status'); s.textContent=msg||''; s.className='status'+(err?' err':''); s.style.display=msg?'':'none'; }

/* ================= Grist ================= */
grist.ready({ requiredAccess:'full' });
grist.onRecords(() => loadAll());

async function loadAll(auto){
  const seq = ++loadSeq;
  try{
    const facultative = t => grist.docApi.fetchTable(t).catch(() => null);   // Commentaires, Actions, Taches
    const [g,c,p,a,jc,ta,tt,smp,smr,qd] = await Promise.all([
      ...[T.GRP,T.COL,T.PRJ,T.AFF].map(t => grist.docApi.fetchTable(t)),
      facultative(T_COM), facultative(T_ACT), facultative(T_TAC), facultative(T_SMP), facultative(T_SMR), facultative(T_QUO)]);
    if(seq !== loadSeq) return;
    if(auto && pending) return;                        // écriture en cours : on attend son rechargement
    const sig = JSON.stringify([g,c,p,a,jc,ta,tt,smp,smr,qd]);
    if(auto && sig === lastSig) return;               // rien n'a changé : pas de re-rendu
    lastSig = sig;
    grps = g.id.map((id,i)=>({id, nom:g.Groupement[i]||'(sans nom)'}));
    collabs = c.id.map((id,i)=>({id, nom:c.Collaborateur[i]||'(sans nom)', grp:c.Groupement[i]}))
               .sort((x,y)=>x.nom.localeCompare(y.nom,'fr'));
    hasPrjCollab = 'Collaborateur' in p; hasPrio = 'Priorite' in p; hasDD = 'DDSIS' in p;
    projets = p.id.map((id,i)=>({id, nom:p.Libelle_Projet[i]||'(sans titre)', porteur:p.Groupement_Porteur[i],
                                 pcol: hasPrjCollab ? (p.Collaborateur[i]||0) : 0,
                                 prio: hasPrio ? (p.Priorite[i]||'') : '',
                                 dd: hasDD ? p.DDSIS[i]===DD_VAL : false}))
               .sort((x,y)=>x.nom.localeCompare(y.nom,'fr'));
    hasCollab = 'Collaborateur' in a; hasCom = 'Commentaire' in a;
    hasJournal = !!(jc && 'Affectation' in jc && 'Texte' in jc);
    journal = hasJournal ? jc.id.map((id,i)=>({id, aff:jc.Affectation[i], txt:(jc.Texte[i]||'').trim(),
                  auteur: jc.Auteur ? (jc.Auteur[i]||'') : '', date: jc.Date ? jc.Date[i] : null}))
                  .filter(e=>e.aff && e.txt).sort((x,y)=>(x.date||0)-(y.date||0) || x.id-y.id) : [];
    affs = a.id.map((id,i)=>({id, prj:a.Projet[i], grp:a.Groupement[i], col:hasCollab ? (a.Collaborateur[i]||0) : 0,
                              q:a.Trimestre[i], imp:a.Impact[i], old: hasCom ? (a.Commentaire[i]||'').trim() : ''}));
    // Texte de commentaire consolidé (ancien commentaire + journal), utilisé par tous les affichages
    affs.forEach(x => {
      x.jr = journal.filter(e=>e.aff===x.id);
      x.com = [x.old ? x.old : '', ...x.jr.map(e => `${e.auteur||'?'} (${fmtDate(e.date)}) : ${e.txt}`)].filter(Boolean).join('\n');
    });
    hasCom = hasCom || hasJournal;
    loadActionsTaches(ta, tt);
    loadSM(smp, smr);
    hasQuo = !!(qd && ['Groupement','Trimestre','Pourcentage'].every(k => k in qd));
    quot = {};
    if(hasQuo) qd.id.forEach((id,i) => {
      const v = qd.Pourcentage[i];
      if(v === null || v === '' || isNaN(+v)) return;
      (quot[qd.Groupement[i]] ||= {})[qd.Trimestre[i]] = {id, v:Math.round(+v*100)};   // colonne au format % : 0,5 = 50 %
    });
    reindex();
    if(!profilInit){ profilInit = true; setTimeout(initProfil); }
    setStatus(hasCollab ? '' : "Colonne Affectation.Collaborateur absente : la distinction par collaborateur est désactivée.");
    render();
  }catch(err){
    console.error(err);
    setStatus(`Chargement impossible. Vérifiez les tables ${Object.values(T).join(', ')} et l'accès complet du widget.`, true);
  }
}
async function act(actions){
  if(!actions.length) return;
  try{ const r = await grist.docApi.applyUserActions(actions); await loadAll(); return r; }
  catch(err){ console.error(err); setStatus("Écriture refusée : " + err.message, true); }
}
// Applique d'abord la modification à l'écran, puis l'enregistre ; recharge dans tous les cas
async function actOpt(actions, local){
  if(!actions.length) return;
  pending++;
  try{ local(); reindex(); render(); }catch(e){ console.error(e); }
  try{ await grist.docApi.applyUserActions(actions); }
  catch(err){ console.error(err); setStatus("Écriture refusée : " + err.message, true); }
  pending--;
  await loadAll();
}
const tmpAff = (prj, grp, col, q, imp) => ({id:-(Date.now() + Math.random()), prj, grp, col, q, imp, old:'', jr:[], com:''});
function affFields(prj, grp, col, q, imp){
  const f = { Projet:prj, Groupement:grp, Trimestre:q, Impact:imp };
  if(hasCollab) f.Collaborateur = col || 0;
  return f;
}
const addAff = (prj,grp,col,q,imp) => ['AddRecord', T.AFF, null, affFields(prj,grp,col,q,imp)];

/* ================= Navigation ================= */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
$('#refresh').onclick = () => loadAll();

function render(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v===view));
  const app = $('#app');
  const scrolls = {};
  document.querySelectorAll('.col[data-drop]').forEach(c => scrolls[c.dataset.drop] = c.scrollTop);
  if(view==='kanban') app.innerHTML = viewKanban();
  else if(view==='charge') app.innerHTML = viewCharge();
  else if(view==='etat') app.innerHTML = viewEtat();
  else if(view==='projet') app.innerHTML = viewEtatProjet();
  else if(view==='prio') app.innerHTML = viewEtatPrio();
  else if(view==='p2a') app.innerHTML = viewP2A();
  else if(view==='ve') app.innerHTML = viewVE();
  else if(view==='sm') app.innerHTML = viewSM();
  else app.innerHTML = viewBilan();
  if(view==='kanban'){
    bindKanban(); fitBoard();
    document.querySelectorAll('.col[data-drop]').forEach(c => { if(scrolls[c.dataset.drop]) c.scrollTop = scrolls[c.dataset.drop]; });
    if(K.focus){
      const [pf, qf] = K.focus.split('|');
      const el = document.querySelector(`.card[data-prj="${pf}"][data-q="${qf}"]`);
      if(el) el.focus({preventScroll:false});
      K.focus = '';
    }
  }
  bindPD();
  if(['etat','projet','prio'].includes(view)) bindScb();
  renderModal();
}

/* ================= Vue Kanban ================= */
// Vue « Porteur → impacté » : affectations du projet sur le groupement (et collaborateur) ciblé
function piAffs(prjId, q){
  let l = affsOf(prjId).filter(a => a.grp===K.ig && (q===undefined || a.q===q));
  if(K.ic) l = l.filter(a => a.col===K.ic);
  return l;
}
const kAffs = (prjId, q) => K.view==='pi' ? piAffs(prjId, q) : visibleAffs(prjId, q);
function visibleAffs(prjId, q){
  let l = affsOf(prjId).filter(a => a.q===q);
  // Trimestres : affectations qui impactent le groupement / collaborateur filtré
  if(F.col){ const g = (collabs.find(c=>c.id===F.col)||{}).grp;
             l = l.filter(a => a.col===F.col || (!a.col && a.grp===g)); }
  else if(F.grp) l = l.filter(a=>a.grp===F.grp);
  return l;
}
// « BERTIN Frédéric » -> « BERTIN F. » (mots en majuscules = nom, autres = prénom)
function shortName(n){
  const w = String(n||'').trim().split(/\s+/);
  const nom = w.filter(x => x === x.toUpperCase());
  const pre = w.filter(x => x !== x.toUpperCase());
  if(!nom.length || !pre.length) return n;
  return nom.join(' ') + ' ' + pre.map(x => x[0] + '.').join('');
}
function chipsHtml(list, hlGrp){
  // Regroupe par groupement : impact le plus fort + noms des collaborateurs
  const by = {};
  list.forEach(a => {
    const k = a.grp; by[k] = by[k] || {imp:'Faible', noms:[], grpLevel:false, coms:[]};
    if(a.com) by[k].coms.push((a.col ? cName(a.col)+' : ' : '') + a.com);
    if(a.imp==='Fort') by[k].imp = 'Fort';
    if(a.col) by[k].noms.push(cName(a.col)); else by[k].grpLevel = true;
  });
  return Object.entries(by).map(([g,v]) => {
    const title = `${gName(+g)} — impact ${v.imp}` + (v.noms.length ? ` — ${v.noms.join(', ')}` : '')
                + (v.coms.length ? `\n💬 ${v.coms.join('\n💬 ')}` : '');
    const sn = v.noms.map(shortName);
    const extra = !sn.length ? '' : ' · ' + esc(sn.slice(0,2).join(', ')) + (sn.length>2 ? ` +${sn.length-2}` : '');
    return `<span class="tag ${+g===hlGrp?'hl':''}" data-g="${g}" data-tg="1" role="button" title="${esc(title + '\nClic : passer en ' + (v.imp==='Fort' ? 'faible' : 'fort'))}">${esc(gName(+g))} <b class="${esc(v.imp)}">${esc((v.imp||'?').toLowerCase())}</b>${extra}${hasCom ? `<span class="cbub ${v.coms.length ? '' : 'vide'}" data-comg="${g}" role="button" tabindex="0" title="${v.coms.length ? 'Voir / ajouter un commentaire' : 'Ajouter un commentaire'}">💬</span>` : ''}</span>`;
  }).sort((x,y) => (y.includes(' hl"')?1:0) - (x.includes(' hl"')?1:0)).join('');
}
function cardHtml(p, q, list, extra){
  // Toutes les affectations du trimestre sont affichées ; le groupement filtré / ciblé est mis en avant
  const hl = K.view==='pi' ? K.ig : F.col ? (IDX.c.get(F.col)||{}).grp : F.grp;
  if(list) list = affsOf(p.id).filter(a => a.q===q);
  return `<div class="card ${K.compact?'compact':''}" tabindex="0" draggable="true" style="--suit:${gColor(p.porteur)}"
            data-prj="${p.id}" data-q="${q===null?'':Q.indexOf(q)}" title="Clic : fiche projet — flèches ← → : changer de trimestre">
    <div class="banner"><span class="flag">⚑</span><span>${esc(gName(p.porteur))}</span>${p.pcol ? `<span class="who">${esc(cName(p.pcol))}</span>` : ''}${prioBadge(p)}${ddBadge(p)}</div>
    <div class="body">
      <div class="t">${esc(p.nom)}</div>
      ${list && !K.compact ? `<div class="k">Impact</div><div class="chips">${chipsHtml(list, hl)}</div>` : ''}
      ${extra && !K.compact ? `<div class="k" style="margin-top:4px">${extra}</div>` : ''}
    </div>
  </div>`;
}
function kViewSel(){
  return `<div class="fg"><label>Vue</label><select id="kView">
    <option value="std" ${K.view==='std'?'selected':''}>Standard</option>
    <option value="pi" ${K.view==='pi'?'selected':''}>Porteur → impacté</option></select></div>`;
}
function kTools(){
  return `<div class="fg"><label>Tri des cartes</label><select id="kSort">
      ${[['prio','Priorité'],['porteur','Porteur'],['nom','Nom']].map(([v,l]) => `<option value="${v}" ${K.sort===v?'selected':''}>${l}</option>`).join('')}
    </select></div>
    <div class="ktools"><label class="ck"><input type="checkbox" id="kCompact" ${K.compact?'checked':''}> Mode compact</label>
    <button id="fReset">Réinitialiser</button></div>`;
}
function viewKanbanPI(){
  const cmp = kSort[K.sort] || byPrio;
  const cibles = K.ig ? collabs.filter(c => c.grp===K.ig) : [];
  let h = `<div class="toolbar">${kViewSel()}
    <div class="fg"><label>Mon groupement (porteur)</label><select id="kPg">${opts(grps, K.pg, [0,'— choisir —'])}</select></div>

           : `Pas encore sur ${cible}` + (ailleurs ? ' — planifié ailleurs' : ' — non planifié');
      } else if(affsOf(p.id).length) st = 'Déjà planifié sur d\'autres groupements';

    }).join('') : `<div class="empty">${K.pool==='portefeuille' ? 'Aucun projet porté.' : `Tous les projets sont planifiés sur ${cible}.`}</div>`;

function viewKanban(){

    ${pdFilters()}${kTools()}
  </div><div class="board ${K.todoOpen?'':'todo-closed'}">`;

  // Colonne "À planifier" : projets sans affectation dont le filtre est porteur
  const cmp = kSort[K.sort] || byPrio;
  const todo = projets.filter(p => matchPorteur(p) && !affsOf(p.id).length).sort(cmp);
  if(K.todoOpen){
    h += `<div class="col todo" data-drop=""><div class="col-head"><b>À planifier</b>
      <span class="n">${todo.length} <button class="colbtn" id="todoToggle" title="Replier la colonne">◀</button></span></div>`;

    h += `</div>`;
  } else {
    h += `<div class="col todo closed" data-drop="" id="todoToggle" title="Déplier « À planifier »"><div class="vlab">＋ À planifier (${todo.length})</div></div>`;
  }

  Q.forEach((q,qi) => {
    const cards = projets.filter(matchPD).sort(cmp)
                         .map(p => [p, visibleAffs(p.id,q)]).filter(([,l])=>l.length);
    const tot = cards.reduce((t,[,l]) => t + sum(l), 0);
    h += `<div class="col" data-drop="${qi}"><div class="col-head"><b>${QS[qi]}</b><span class="n">${cards.length} projet(s) · ${tot} pt(s)</span></div>`;
    h += cards.length ? cards.map(([p,l])=>cardHtml(p,q,l)).join('') : `<div class="empty">Déposez un projet ici.</div>`;
    h += `</div>`;
  });
  h += `</div><p class="hint">« À planifier » : projets non planifiés dont le groupement / collaborateur filtré est porteur.
    Trimestres : projets qui impactent le groupement / collaborateur filtré.
    Glisser une carte (ou flèches ← → sur une carte sélectionnée) déplace les affectations affichées ; Maj + glisser les copie.
    Clic sur une étiquette d'impact : bascule faible / fort. Points = total des impacts affichés.
    Depuis « À planifier », le projet est affecté à son groupement porteur (ou au collaborateur filtré), en impact faible. Clic sur une carte : affectations détaillées.</p>`;
  return h;
}
function bindKanban(){
  $('#kView').onchange = e => { K.view = e.target.value; render(); };
  if($('#kPg')) $('#kPg').onchange = e => { K.pg = +e.target.value; render(); };
  if($('#kIg')) $('#kIg').onchange = e => { K.ig = +e.target.value; K.ic = 0; render(); };
  if($('#kIc')) $('#kIc').onchange = e => { K.ic = +e.target.value; render(); };
  document.querySelectorAll('[data-pool]').forEach(b => b.onclick = e => { e.stopPropagation(); K.pool = b.dataset.pool; render(); });
  if($('#fGrp')) $('#fGrp').onchange = e => { F.grp = +e.target.value;
    if(F.col && F.grp && (collabs.find(c=>c.id===F.col)||{}).grp !== F.grp) F.col = 0; render(); };
  if($('#fCol')) $('#fCol').onchange = e => { F.col = +e.target.value;
    const c = collabs.find(x=>x.id===F.col); if(c) F.grp = c.grp; render(); };
  $('#fReset').onclick = () => { if(K.view==='pi'){ K.pg = K.ig = K.ic = 0; } else { F.grp = F.col = 0; } F.prio=F.dd=F.txt=''; render(); };
  $('#kSort').onchange = e => { K.sort = e.target.value; render(); };
  $('#kCompact').onchange = e => { K.compact = e.target.checked; render(); };
  if($('#todoToggle')) $('#todoToggle').onclick = e => { e.stopPropagation(); K.todoOpen = !K.todoOpen; render(); };

  document.querySelectorAll('.card').forEach(c => {
    c.ondragend = () => { dragging = false; };
    c.ondragstart = e => (dragging = true) && e.dataTransfer.setData('text/plain', JSON.stringify({prj:+c.dataset.prj, q:c.dataset.q}));
    c.onclick = () => openModal(+c.dataset.prj);
    c.querySelectorAll('.cbub').forEach(bu => {
      const go = e => {
        e.stopPropagation(); e.preventDefault();
        const prj = +c.dataset.prj, q = Q[+c.dataset.q], g = +bu.dataset.comg;
        const l = affsOf(prj).filter(a => a.q===q && a.grp===g && a.id > 0);
        const withCom = l.filter(a => a.com);
        // collaborateur ciblé (vue porteur → impacté), puis commentaire existant du groupement, puis affectation du groupement
        const a = (K.view==='pi' && K.ic && l.find(x => x.col===K.ic))
               || withCom.find(x => !x.col) || withCom[0] || l.find(x => !x.col) || l[0];
        openModal(prj, a && a.id);
      };
      bu.onclick = go;
      bu.onkeydown = e => { if(e.key==='Enter'||e.key===' ') go(e); };
      bu.draggable = false;
    });
    c.querySelectorAll('.tag[data-tg]').forEach(t => {
      if(c.dataset.q === '') return;
      t.onclick = e => { e.stopPropagation(); toggleImpact(+c.dataset.prj, Q[+c.dataset.q], +t.dataset.g); };
    });
    c.onkeydown = e => {
      if(e.key==='Enter'){ openModal(+c.dataset.prj); return; }
      if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
      e.preventDefault();
      const fromI = c.dataset.q === '' ? -1 : +c.dataset.q;
      const toI = fromI + (e.key==='ArrowRight' ? 1 : -1);
      if(toI < -1 || toI > 3) return;
      K.focus = `${c.dataset.prj}|${toI<0 ? '' : toI}`;
      moveProject(+c.dataset.prj, fromI<0 ? null : Q[fromI], toI<0 ? null : Q[toI], false);
    };
  });
  document.querySelectorAll('.col').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = () => col.classList.remove('over');
    col.ondrop = e => {
      e.preventDefault(); col.classList.remove('over');
      let d; try{ d = JSON.parse(e.dataTransfer.getData('text/plain')); }catch{ return; }
      const from = d.q === '' ? null : Q[+d.q];
      const to = col.dataset.drop === '' ? null : Q[+col.dataset.drop];
      moveProject(d.prj, from, to, e.shiftKey);
    };
  });
}
async function moveProject(prjId, from, to, copy){
  if(from === to) return;
  const p = pObj(prjId); if(!p) return;
  // Retour vers "À planifier" : suppression des affectations visibles du trimestre d'origine
  if(to === null){
    const src = kAffs(prjId, from);
    if(src.length && confirm(`Retirer « ${p.nom} » de ${from} (${src.length} affectation(s)) ?`) && confirmCom(src))
      await actOpt(rmAffs(src), () => { affs = affs.filter(a => !src.includes(a)); });
    return;
  }
  // Première planification
  if(from === null){
    let grp = p.porteur, col = 0;
    if(K.view==='pi'){
      grp = K.ig; col = hasCollab ? K.ic : 0;
      if(affsOf(prjId).some(a => a.q===to && a.grp===grp && a.col===col)) return;   // déjà présent (portefeuille)
    }
    else if(F.col && hasCollab){ col = F.col; grp = (collabs.find(c=>c.id===col)||{}).grp || grp; }
    if(!grp){ alert("Ce projet n'a pas de groupement porteur : ouvrez sa fiche pour l'affecter."); return; }
    await actOpt([addAff(prjId, grp, col, to, 'Faible')], () => affs.push(tmpAff(prjId, grp, col, to, 'Faible')));
    return;
  }
  // Déplacement ou copie entre trimestres (affectations visibles avec le filtre actif)
  const src = kAffs(prjId, from);
  const actions = [], locals = [];
  src.forEach(s => {
    const dup = affsOf(prjId).find(a => a.grp===s.grp && a.col===s.col && a.q===to);
    if(copy){ if(!dup) locals.push(() => affs.push(tmpAff(prjId, s.grp, s.col, to, s.imp))); }
    else if(dup) locals.push(() => { affs = affs.filter(a => a !== s); if(s.com) dup.com = [dup.com, s.com].filter(Boolean).join('\n'); });
    else locals.push(() => { s.q = to; });
    if(copy){ if(!dup) actions.push(addAff(prjId, s.grp, s.col, to, s.imp)); }
    else if(dup){
      if(s.old && s.old !== dup.old)
        actions.push(['UpdateRecord', T.AFF, dup.id, {Commentaire: dup.old ? dup.old + '\n' + s.old : s.old}]);
      (s.jr||[]).forEach(e => actions.push(['UpdateRecord', T_COM, e.id, {Affectation: dup.id}]));  // le journal suit
      actions.push(['RemoveRecord', T.AFF, s.id]);
    }
    else actions.push(['UpdateRecord', T.AFF, s.id, {Trimestre:to}]);
  });
  await actOpt(actions, () => locals.forEach(fn => fn()));
}
// Bascule faible <-> fort pour un groupement sur un trimestre (toutes ses affectations)
async function toggleImpact(prjId, q, grp){
  const l = affsOf(prjId).filter(a => a.q===q && a.grp===grp && a.id > 0);
  if(!l.length) return;
  const imp = l.some(a => a.imp==='Fort') ? 'Faible' : 'Fort';
  await actOpt(l.map(a => ['UpdateRecord', T.AFF, a.id, {Impact:imp}]), () => l.forEach(a => a.imp = imp));
}

// Saisie du quotidien (% par trimestre) pour un groupement
function quoForm(){
  if(!hasQuo) return `<p class="hint no-print">Pour saisir la part du quotidien de chaque groupement, créez la table <b>${T_QUO}</b>
    avec les colonnes Groupement (référence vers Groupement), Trimestre (texte, par exemple « ${Q[0]} ») et Pourcentage (numérique, format pourcentage : 0,5 = 50 %).</p>`;
  const saved = q => { const v = quotOf(QU.grp, q); return v === null ? '' : String(v); };
  const vals = QU.draft || Q.map(saved);
  return `<div class="quo no-print vehelp-wrap">
    <div class="row">
      <div class="fg"><label>Quotidien du groupement
        <button class="vehelp-btn ${QU.help?'on':''}" id="quHelpBtn" style="width:20px; height:20px; font-size:11px; margin-left:4px" aria-label="Aide sur le quotidien" aria-expanded="${QU.help}">?</button></label>
        <select id="quG">${opts(grps, QU.grp, [0,'Choisir un groupement'])}</select></div>
      ${QU.grp ? Q.map((q,i) => `<div class="fg"><label>${QS[i]} (%)</label>
        <input type="number" min="0" max="100" step="1" data-qi="${i}" value="${esc(vals[i])}" placeholder="—"></div>`).join('')
        + `<button class="primary" id="quSave">Enregistrer</button>` : ''}
    </div>
    ${QU.err ? `<div class="qerr">${esc(QU.err)}</div>` : ''}
    ${QU.help ? `<div class="vehelp" style="top:30px"><div class="vh-top"><b>Estimer le quotidien</b><button class="vh-x" id="quHelpX" aria-label="Fermer">×</button></div>
      <p style="margin-top:6px">Estimez la part du temps de votre groupement consacrée au quotidien sur chaque trimestre (activité courante, demandes, interventions, gestion administrative…),
      en retirant tout ce qui relève des projets et actions suivis dans ce planning. Dans les équipes de support ou de service, le quotidien représente couramment 60 à 80 % du temps.
      Laissez vide si vous ne souhaitez pas l'estimer.</p>
      <p style="margin-top:6px">Calcul : occupation = quotidien % + points d'impact × ${PT_PCT} % (faible = ${PT_PCT} %, fort = ${2*PT_PCT} %).</p></div>` : ''}
  </div>`;
}
function bindQuo(){
  if(!$('#quG')) return;
  $('#quG').onchange = e => { QU.grp = +e.target.value; QU.draft = null; QU.err = ''; render(); };
  $('#quHelpBtn').onclick = e => { e.preventDefault(); QU.help = !QU.help; render(); };
  if($('#quHelpX')) $('#quHelpX').onclick = () => { QU.help = false; render(); };
  document.querySelectorAll('.quo input[data-qi]').forEach(inp => inp.oninput = () => {
    QU.draft = [...document.querySelectorAll('.quo input[data-qi]')].map(x => x.value);   // conservé si la vue se rafraîchit
    if(QU.err){ QU.err = ''; const e = $('.quo .qerr'); if(e) e.remove(); }
  });
  if($('#quSave')) $('#quSave').onclick = saveQuo;
}
async function saveQuo(){
  const g = QU.grp; if(!g) return;
  const vals = [...document.querySelectorAll('.quo input[data-qi]')].map(x => x.value.trim());
  if(vals.some(v => v !== '' && !(+v >= 0 && +v <= 100))){ QU.err = 'Saisissez un pourcentage entre 0 et 100, ou laissez la case vide.'; QU.draft = vals; render(); return; }
  const actions = [];
  Q.forEach((q,i) => {
    const cur = quot[g] && quot[g][q], v = vals[i];
    if(v === '') { if(cur) actions.push(['RemoveRecord', T_QUO, cur.id]); }
    else if(!cur) actions.push(['AddRecord', T_QUO, null, {Groupement:g, Trimestre:q, Pourcentage:Math.round(+v)/100}]);
    else if(cur.v !== Math.round(+v)) actions.push(['UpdateRecord', T_QUO, cur.id, {Pourcentage:Math.round(+v)/100}]);
  });
  QU.draft = null; QU.err = '';
  if(actions.length) await act(actions); else render();
}

// Tableau commun aux états : Projet | Porteur | T1..T4 (étiquettes par groupement, 💬 au clic) | ligne de total
function tagCell(la, p, qi, ctx, withNames){
  const by = {}, cm = {}, nm = {};
  la.filter(a => a.prj===p.id && a.q===Q[qi]).forEach(a => {
    if(!by[a.grp] || a.imp==='Fort') by[a.grp] = a.imp;
    if(a.col && withNames) (nm[a.grp] = nm[a.grp] || new Set()).add(shortName(cName(a.col)));
    if(a.com) (cm[a.grp] = cm[a.grp] || []).push((a.col ? cName(a.col)+' : ' : '') + a.com);
  });
  return Object.entries(by).sort(([x],[y]) => gName(+x).localeCompare(gName(+y),'fr')).map(([g,imp]) => {
    const key = `${ctx}|${p.id}|${qi}|${g}`, open = S.open.has(key);
    const noms = nm[g] ? ` <span class="nm">(${esc([...nm[g]].join(', '))})</span>` : '';
    return `<div class="tag ${open?'hl':''}" style="display:inline-block;margin:1px">${esc(gName(+g))} <b class="${esc(imp)}">${esc((imp||'?').toLowerCase())}</b>${noms}${cm[g]?`<span class="cbub scb" data-key="${esc(key)}" role="button" tabindex="0" title="Afficher le commentaire">💬</span>`:''}</div>`
         + (open && cm[g] ? `<div class="gcom" style="margin:2px 0 4px">${esc(gName(+g))} — ${esc(cm[g].join('\n'))}</div>` : '');
  }).join('');
}
function listTable(list, la, ctx, totalLabel, totalFn, withNames){
  let h = `<table class="grid fixed"><colgroup><col style="width:28%"><col style="width:16%">${QS.map(()=>'<col style="width:14%">').join('')}</colgroup>
    <tr><th>Projet</th><th>Porteur</th>${QS.map(x=>`<th>${x}</th>`).join('')}</tr>`;
  list.forEach(p => {
    h += `<tr><td>${esc(p.nom)} ${prioBadge(p)} ${ddBadge(p)}</td><td>${porteurTxt(p)}</td>`;

function ganttCells(list, color){
  // list : affectations d'un projet (déjà restreintes) ; barre continue sur les trimestres occupés
  const imp = Q.map(q => { const l = list.filter(a=>a.q===q); return !l.length ? '' : l.some(a=>a.imp==='Fort') ? 'Fort' : 'Faible'; });
  return imp.map((v,i) => {
    if(!v) return `<td class="q"></td>`;
    const cls = [v, !imp[i-1]?'first':'', !imp[i+1]?'last':''].join(' ');
    const bg = v==='Fort' ? color : color + '55';
    // Bulles récapitulatives : « GPTN : Fort », une par groupement impacté sur le trimestre
    const by = {};
    list.filter(a=>a.q===Q[i]).forEach(a => {
      const k = by[a.grp] = by[a.grp] || {imp:'Faible', noms:[], coms:[]};
      if(a.imp==='Fort') k.imp = 'Fort';
      if(a.col) k.noms.push(shortName(cName(a.col)));
      if(a.com) k.coms.push((a.col ? cName(a.col)+' : ' : '') + a.com);
    });
    const prj = list.length ? list[0].prj : 0;
    const chips = Object.entries(by)
      .sort(([x],[y]) => gName(+x).localeCompare(gName(+y),'fr'))
      .map(([g,k]) => {
        const key = `${prj}|${i}|${g}`, open = P.open.has(key);
        return `<span class="gchip ${open?'open':''}">${esc(gName(+g))} : <b class="${esc(k.imp)}">${esc(k.imp)}</b>${k.noms.length?` <span class="nm">(${esc(k.noms.join(', '))})</span>`:''}${k.coms.length?`<span class="cbub gcb" data-key="${key}" role="button" tabindex="0" title="Afficher le commentaire">💬</span>`:''}</span>`
             + (open && k.coms.length ? `<div class="gcom">${esc(gName(+g))} — ${esc(k.coms.join('\n'))}</div>` : '');
      }).join('');
    return `<td class="q"><div class="gchips">${chips}</div></td>`;
  }).join('');
}

// Le mot de passe est stocké haché (SHA-256) dans les options du widget.
// Barrière d'usage dans le widget : la protection réelle des tables relève des règles d'accès Grist.
let adminHash = '', unlocked = false, pwdOpen = false;
let optsReadyRes; const optsReady = new Promise(r => optsReadyRes = r);
grist.onOptions(o => { adminHash = (o && o.adminHash) || ''; optsReadyRes(); });
async function sha(txt){
  if(window.crypto && crypto.subtle){
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  return sha256js(txt);                                // secours si crypto.subtle indisponible
}
function sha256js(str){
  const K = [], H = [];
  const isP = n => { for(let d=2; d*d<=n; d++) if(n%d===0) return false; return true; };
  for(let n=2, c=0; c<64; n++) if(isP(n)){ if(c<8) H[c] = (Math.pow(n,1/2)*2**32)|0; K[c++] = (Math.pow(n,1/3)*2**32)|0; }
  const bytes = [...new TextEncoder().encode(str)], bl = bytes.length*8;
  bytes.push(0x80); while(bytes.length%64 !== 56) bytes.push(0);
  for(let i=7; i>=0; i--) bytes.push(i>3 ? 0 : (bl >>> (i*8)) & 255);
  const rotr = (x,n) => (x>>>n) | (x<<(32-n));
  for(let o=0; o<bytes.length; o+=64){
    const w = [];
    for(let i=0; i<16; i++) w[i] = (bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16; i<64; i++){
      const s0 = rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3), s1 = rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);
      w[i] = (w[i-16]+s0+w[i-7]+s1)|0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i=0; i<64; i++){
      const t1 = (h + (rotr(e,6)^rotr(e,11)^rotr(e,25)) + ((e&f)^(~e&g)) + K[i] + w[i])|0;
      const t2 = ((rotr(a,2)^rotr(a,13)^rotr(a,22)) + ((a&b)^(a&c)^(b&c)))|0;
      h = g; g = f; f = e; e = (d+t1)|0; d = c; c = b; b = a; a = (t1+t2)|0;
    }
    [a,b,c,d,e,f,g,h].forEach((v,i) => H[i] = (H[i]+v)|0);
  }
  return H.map(v => (v>>>0).toString(16).padStart(8,'0')).join('');
}
function askPwd(title, confirmField){
  return new Promise(resolve => {
    pwdOpen = true;
    const box = $('#pwd');
    box.innerHTML = `<div class="backdrop" id="pwdBd"><div class="pwdbox" role="dialog" aria-label="${esc(title)}">
      <h2 style="margin:0 0 10px; font-size:15px">${esc(title)}</h2>
      <label class="nom">Mot de passe</label><input type="password" id="pw1" autocomplete="off">
      ${confirmField ? '<label class="nom">Confirmation</label><input type="password" id="pw2" autocomplete="off">' : ''}
      <p class="err" id="pwErr"></p>
      <div class="row" style="justify-content:flex-end; margin:0"><button id="pwCancel">Annuler</button><button class="primary" id="pwOk">Valider</button></div>
    </div></div>`;
    const close = v => { pwdOpen = false; box.innerHTML = ''; resolve(v); };
    const ok = () => {
      const v1 = $('#pw1').value;
      if(!v1){ $('#pwErr').textContent = 'Saisissez le mot de passe.'; return; }
      if(confirmField && v1 !== $('#pw2').value){ $('#pwErr').textContent = 'Les deux saisies sont différentes.'; return; }
      close(v1);
    };
    $('#pwOk').onclick = ok;
    $('#pwCancel').onclick = () => close(null);
    box.querySelectorAll('input').forEach(i => i.onkeydown = e => {
      $('#pwErr').textContent = '';
      if(e.key==='Enter') ok(); if(e.key==='Escape') close(null);
    });
    $('#pw1').focus();
  });
}
function updateLock(){
  const b = $('#lock');
  b.classList.toggle('on', unlocked);

async function requireAdmin(){
  if(unlocked) return true;
  if(!adminHash){
    const p = await askPwd("Définir le mot de passe d'administration", true);
    if(!p) return false;
    const h = await sha(p);
    try{ await grist.setOption('adminHash', h); }
    catch(e){ alert("Enregistrement du mot de passe impossible : il faut les droits d'édition sur le document."); return false; }
    adminHash = h; unlocked = true; updateLock(); return true;
  }
  const p = await askPwd("Mot de passe d'administration", false);
  if(!p) return false;
  if(await sha(p) === adminHash){ unlocked = true; updateLock(); return true; }
  alert('Mot de passe incorrect.');
  return false;
}
async function changePwd(){
  if(!await requireAdmin()) return;
  const p = await askPwd('Nouveau mot de passe', true);
  if(!p) return;
  try{ const h = await sha(p); await grist.setOption('adminHash', h); adminHash = h; alert('Mot de passe modifié.'); }
  catch(e){ alert("Enregistrement du mot de passe impossible : il faut les droits d'édition sur le document."); }
}

const T_ACT = 'Actions', T_TAC = 'Taches';
const TACHE_LIB = 'A compléter - séminaire EQDIR';
const ST_FIN = 'Terminée', ST_ABANDON = 'Abandonnée', ST_DEFAUT = 'À faire';
let actions = [], taches = [], hasAT = false, hasRef = false, colsAct = new Set(), colsTac = new Set();
const val = (t, c, i, d) => (t && c in t) ? (t[c][i] ?? d) : d;
function loadActionsTaches(ta, tt){
  colsAct = new Set(ta ? Object.keys(ta) : []);

    debut:ta.Date_debut[i], fin:ta.Date_echeance[i], imp:val(ta,'Impact',i,''), cols:val(ta,'Collaborateurs',i,''), sync:val(ta,'Synchro',i,'')}));

const only = (fields, cols) => Object.fromEntries(Object.entries(fields).filter(([k]) => cols.has(k)));
const qYear = q => +((String(q).match(/(\d{4})/)||[])[1]) || 2027;
const qStart = (qi, y) => Date.UTC(y, qi*3, 1)/1000;          // 1er jour du trimestre (secondes, minuit UTC)
const qEnd   = (qi, y) => Date.UTC(y, qi*3+3, 0)/1000;        // dernier jour du trimestre
const blockRange = label => { const m = String(label).match(/T(\d)(?:-T(\d))?/); return m ? [+m[1], +(m[2]||m[1])] : null; };

// Planning attendu : une action par projet × groupement, une tâche par bloc de trimestres consécutifs
function buildPlan(){
  const plan = new Map();
  affs.forEach(a => {
    const qi = Q.indexOf(a.q); if(qi<0 || !a.prj || !a.grp) return;
    const k = a.prj + '|' + a.grp;
    const e = plan.get(k) || {prj:a.prj, grp:a.grp, qs:new Set(), imp:'Faible', cols:new Set()};
    e.qs.add(qi); if(a.imp==='Fort') e.imp = 'Fort'; if(a.col) e.cols.add(cName(a.col));
    plan.set(k, e);
  });
  plan.forEach(e => {
    const qs = [...e.qs].sort((x,y)=>x-y), y = qYear(Q[qs[0]]);
    e.debut = qStart(qs[0], y); e.fin = qEnd(qs[qs.length-1], y);
    e.blocks = [];
    qs.forEach(qi => { const b = e.blocks[e.blocks.length-1]; if(b && b.to===qi-1) b.to = qi; else e.blocks.push({from:qi, to:qi}); });
    e.blocks.forEach(b => { b.label = b.from===b.to ? QS[b.from] : QS[b.from]+'-'+QS[b.to]; b.debut = qStart(b.from, y); b.fin = qEnd(b.to, y); });
    e.libelle = 'Action_' + gName(e.grp);
    e.colsTxt = [...e.cols].sort((x,y)=>x.localeCompare(y,'fr')).join(', ');
  });
  return plan;
}
function computeSync(){
  const plan = buildPlan();
  const r = {addActs:[], updActs:[], flag:[], addTasks:[], updTasks:[], gone:0};
  const byKey = new Map();
  actions.forEach(a => { const k = a.prj+'|'+a.grp; if(!byKey.has(k)) byKey.set(k, a); });
  plan.forEach((e, k) => {
    const act = byKey.get(k);
    if(!act){ r.addActs.push(e); e.blocks.forEach(b => r.addTasks.push({e, b})); return; }
    const f = {};
    if(act.debut !== e.debut) f.Date_debut = e.debut;
    if(act.fin !== e.fin) f.Date_echeance = e.fin;
    if(colsAct.has('Impact') && act.imp !== e.imp) f.Impact = e.imp;
    if(colsAct.has('Collaborateurs') && act.cols !== e.colsTxt) f.Collaborateurs = e.colsTxt;
    if(colsAct.has('Libelle') && !act.lib) f.Libelle = e.libelle;
    const gen = taches.filter(t => t.act===act.id && t.periode);
    const used = new Set(), rest = [];
    const upd = (t, b) => {
      const g = {};
      if(t.debut !== b.debut) g.Date_debut = b.debut;
      if(t.fin !== b.fin) g.Date_echeance = b.fin;
      if(t.periode !== b.label) g.Periode = b.label;
      if(Object.keys(g).length) r.updTasks.push([t.id, g]);
    };
    e.blocks.forEach(b => { const t = gen.find(x => !used.has(x.id) && x.periode===b.label); if(t){ used.add(t.id); upd(t, b); } else rest.push(b); });
    const free = gen.filter(t => !used.has(t.id)).sort((x,y) => (x.debut||0)-(y.debut||0));
    rest.forEach(b => { const t = free.shift(); if(t){ used.add(t.id); upd(t, b); } else r.addTasks.push({actId:act.id, b}); });
    r.gone += free.length;
    const sync = free.map(t => `Tâche ${t.periode} retirée du planning`).join(' ; ');
    if(colsAct.has('Synchro') && act.sync !== sync) f.Synchro = sync;
    if(Object.keys(f).length) r.updActs.push([act.id, f]);
  });
  byKey.forEach((act, k) => {
    const msg = "Plus d'impact au planning";
    if(!plan.has(k) && colsAct.has('Synchro') && act.sync !== msg) r.flag.push([act.id, {Synchro: msg}]);
  });
  return r;
}
async function runSync(){
  if(!hasAT){ alert('Créez les tables Actions et Taches (avec leurs colonnes) pour utiliser cette fonction.'); return; }
  if(!await requireAdmin()) return;
  const r = computeSync();
  const n = r.addActs.length + r.updActs.length + r.flag.length + r.addTasks.length + r.updTasks.length;
  if(!n){ alert('Les actions et les tâches sont déjà à jour.'); return; }
  if(!confirm(`Mise à jour des tables Actions et Taches :\n\n`
    + `• ${r.addActs.length} action(s) à créer\n• ${r.updActs.length} action(s) à mettre à jour\n`
    + `• ${r.flag.length} action(s) sans impact au planning (signalées, non supprimées)\n`
    + `• ${r.addTasks.length} tâche(s) à créer\n• ${r.updTasks.length} tâche(s) à mettre à jour\n`
    + `• ${r.gone} tâche(s) retirée(s) du planning (signalées, non supprimées)\n\nContinuer ?`)) return;
  try{
    const ids = new Map();
    if(r.addActs.length){
      const res = await grist.docApi.applyUserActions(r.addActs.map(e => ['AddRecord', T_ACT, null, only({
        Libelle:e.libelle, Projet:e.prj, Groupement:e.grp, Date_debut:e.debut, Date_echeance:e.fin,
        Impact:e.imp, Collaborateurs:e.colsTxt, Synchro:''}, colsAct)]));
      r.addActs.forEach((e, i) => ids.set(e, res.retValues[i]));
    }
    const acts = [
      ...r.updActs.map(([id,f]) => ['UpdateRecord', T_ACT, id, f]),
      ...r.flag.map(([id,f]) => ['UpdateRecord', T_ACT, id, f]),
      ...r.addTasks.map(x => ['AddRecord', T_TAC, null, only({
        Libelle:TACHE_LIB, Action: x.actId || ids.get(x.e), Date_debut:x.b.debut, Date_echeance:x.b.fin,
        Periode:x.b.label, Statut:ST_DEFAUT}, colsTac)]),
      ...r.updTasks.map(([id,f]) => ['UpdateRecord', T_TAC, id, f])
    ];
    if(acts.length) await grist.docApi.applyUserActions(acts);
    await loadAll();
    alert('Actions et tâches mises à jour.');
  }catch(err){
    console.error(err); await loadAll();
    alert('Mise à jour interrompue : ' + err.message);
  }
}

function bilanRows(){
  const plan = buildPlan(), now = Date.now()/1000;

    const a = actions.find(x => x.id===t.act); if(!a) return null;
    const p = pObj(a.prj); if(!p) return null;

    const retired = !t.periode || !e || !e.blocks.some(b => b.label===t.periode);

  }).filter(Boolean);
}

}

/* ================= P2A : fresque chronologique ================= */
const FR_LANE = 22, FR_MS = 16;                        // hauteur d'une barre / d'une étiquette de jalon
function frBlocks(list){
  // list : affectations -> blocs de trimestres consécutifs avec impact max
  const byQ = Q.map(q => list.filter(a => a.q===q));
  const blocks = [];
  byQ.forEach((l, qi) => {
    if(!l.length) return;
    const imp = l.some(a => a.imp==='Fort') ? 'Fort' : 'Faible';
    const b = blocks[blocks.length-1];
    if(b && b.to===qi-1){ b.to = qi; if(imp==='Fort') b.imp = 'Fort'; b.affs.push(...l); }
    else blocks.push({from:qi, to:qi, imp, affs:[...l]});
  });
  blocks.forEach(b => b.label = b.from===b.to ? QS[b.from] : QS[b.from]+'-'+QS[b.to]);
  return blocks;
}
// Échéances de référence des tâches : projet (et groupement si précisé)
function frRefs(prjId, grpId){
  if(!hasRef) return [];
  const acts = actions.filter(a => a.prj===prjId && (!grpId || a.grp===grpId)).map(a => a.id);
  return taches.filter(t => acts.includes(t.act) && t.refFin);
}
const frYear = () => qYear(Q[0]);
const frPos = ts => { const y = frYear(), a = Date.UTC(y,0,1)/1000, b = Date.UTC(y+1,0,1)/1000; return Math.max(0, Math.min(100, (ts-a)/(b-a)*100)); };
// Répartit les éléments sur des sous-lignes pour éviter les chevauchements
function frPack(items){
  const lanes = [];
  items.sort((x,y) => x.from - y.from || y.to - x.to).forEach(it => {
    let i = lanes.findIndex(end => end < it.from);
    if(i < 0){ i = lanes.length; lanes.push(-1); }
    lanes[i] = it.to; it.lane = i;
  });
  return Math.max(1, lanes.length);
}
function frTrack(items){
  const n = frPack(items);
  const lh = FR_LANE + (P.jal==='none' ? 0 : FR_MS) + 4;
  let h = `<div class="ftrack" style="height:${n*lh + 6}px">`;
  const y = frYear(), now = Date.now()/1000;
  if(now >= Date.UTC(y,0,1)/1000 && now < Date.UTC(y+1,0,1)/1000) h += `<div class="ftoday" style="left:${frPos(now)}%" title="Aujourd'hui"></div>`;
  items.forEach(it => {
    const top = 4 + it.lane*lh, left = it.from*25 + .4, width = (it.to-it.from+1)*25 - .8;
    const color = it.color, bg = it.imp==='Fort' ? color : color + '66';
    h += `<div class="fbar ${it.imp} ${P.sel===it.key?'sel':''}" data-fk="${esc(it.key)}" role="button" tabindex="0"
      style="top:${top}px; left:${left}%; width:${width}%; background:${bg}" title="${esc(it.title)}">${esc(it.text)}${it.com?' 💬':''}</div>`;
    if(P.jal==='none') return;
    const end = qEnd(it.to, y), mt = top + FR_LANE + 1;
    h += `<div class="fms" style="left:${frPos(end)}%; top:${mt}px"><b></b>${fmtDate(end).slice(0,5)}</div>`;
    if(P.jal==='ref') (it.refs||[]).forEach(t => {
      // jalon de référence affiché seulement si la tâche a été replanifiée
      if(!t.fin || t.refFin === t.fin) return;
      const late = t.fin > t.refFin;
      h += `<div class="fms ref ${late?'late':''}" style="left:${frPos(t.refFin)}%; top:${mt}px"
        title="Échéance de référence ${fmtDate(t.refFin)} — échéance actuelle ${fmtDate(t.fin)}${late?' (retard)':' (avance)'}"><b></b>réf. ${fmtDate(t.refFin).slice(0,5)}</div>`;
    });
  });
  return h + `</div>`;
}
const frLabelGrp = list => {
  const by = {};
  list.forEach(a => { if(!by[a.grp] || a.imp==='Fort') by[a.grp] = a.imp; });
  return Object.entries(by).sort(([x],[y]) => gName(+x).localeCompare(gName(+y),'fr'))
    .map(([g,imp]) => `${gName(+g)} ${imp.toLowerCase()}`).join(', ');
};
// Construit les barres d'un projet (affectations déjà restreintes)
function frItems(p, list, rowKey, textFn, color, refGrp){
  const refs = P.jal==='ref' ? frRefs(p.id, refGrp) : [];
  return frBlocks(list).map(b => ({
    from:b.from, to:b.to, imp:b.imp, color,
    key:`${rowKey}|${p.id}|${b.label}`, prj:p.id, block:b,
    text:textFn(b), com:b.affs.some(a=>a.com),
    title:`${p.nom} — ${b.label} — ${frLabelGrp(b.affs)}`,
    refs: refs.filter(t => { const r = blockRange(t.periode); return !r || (r[0]-1 <= b.to && r[1]-1 >= b.from); })
  }));
}
function frDetail(items){
  const it = items.find(x => x.key===P.sel);
  if(!it) return '';
  const p = pObj(it.prj), b = it.block;
  const by = {};
  b.affs.forEach(a => {
    const k = by[a.grp] = by[a.grp] || {imp:'Faible', noms:[], coms:[]};
    if(a.imp==='Fort') k.imp = 'Fort';
    if(a.col) k.noms.push(cName(a.col));
    if(a.com) k.coms.push(`${QS[Q.indexOf(a.q)]} — ${a.com}`);
  });
  const lignes = Object.entries(by).sort(([x],[y]) => gName(+x).localeCompare(gName(+y),'fr')).map(([g,k]) =>
    `<div style="margin:3px 0"><span class="gchip">${esc(gName(+g))} : <b class="${k.imp}">${k.imp}</b>${k.noms.length?` <span class="nm">(${esc([...new Set(k.noms)].join(', '))})</span>`:''}</span>
     ${k.coms.map(c => `<div class="com">💬 ${esc(c)}</div>`).join('')}</div>`).join('');
  const refs = (it.refs||[]).map(t => `réf. ${fmtDate(t.refFin)}${t.fin && t.fin!==t.refFin ? ` → actuelle ${fmtDate(t.fin)}` : ''}`);
  return `<div class="fdet"><h4>${esc(p.nom)} ${prioBadge(p)} ${ddBadge(p)}</h4>
    <div class="nom">Porteur : ${porteurTxt(p)} — ${b.label} (${fmtDate(qStart(b.from, frYear()))} → ${fmtDate(qEnd(b.to, frYear()))})${refs.length ? ' — ' + esc(refs.join(' ; ')) : ''}</div>
    ${lignes}
    <div class="row no-print" style="margin:6px 0 0"><button id="fsFiche" data-prj="${p.id}">Ouvrir la fiche projet</button><button id="fsClose">Fermer</button></div></div>`;
}
function frHeader(){
  const mois = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `<div class="fhead"><div></div><div class="fq">${QS.map(s => `<div>${s} ${frYear()}</div>`).join('')}</div></div>

/* ================= Valeur / effort ================= */
// Valeur : score automatique selon la priorité (P1 = 3, P2 = 2, P3 = 1, Poursuite = 1), non modifiable.
// Effort : somme des points d'impact du projet (faible = 1, fort = 2), tous groupements et trimestres.
const V = { sub:'zones', grp:0, cap:{}, pq:'', help:false, ana:false };   // pq : période de la courbe de Pareto ('' = année, sinon un trimestre de Q)   // cap : capacité par période   // ana : encadré Analyse (Pareto) ouvert   // help : bulle d'explication ouverte   // cap : capacité en points (0 = non définie)
const VAL_AUTO = { P1:3, P2:2, P3:1, Poursuite:1 };
const VAL_HAUTE = 3;                                   // valeur ≥ 3 : valeur élevée
const QD = {
  1:{nom:'Gains rapides', desc:'Valeur élevée, effort faible — à lancer en priorité', cls:'q1', col:'#2e7d4f'},
  2:{nom:'Projets majeurs', desc:'Valeur élevée, effort élevé — à planifier et soutenir', cls:'q2', col:'#2f5d8a'},
  3:{nom:'Opportunités', desc:'Valeur faible, effort faible — si la capacité le permet', cls:'q3', col:'#b3721b'},
  4:{nom:'À éviter', desc:'Valeur faible, effort élevé — reporter ou abandonner', cls:'q4', col:'#b42318'}
};
const autoVal = p => Math.min(4, VAL_AUTO[p.prio] || 1);
const valeurOf = p => ({v:autoVal(p)});
const qBadge = q => `<span class="qb ${QD[q].cls}">${QD[q].nom}</span>`;
const vPill = x => `<span class="vpill" title="Valeur déduite de la priorité">V${x.v}</span>`;

function veData(q){                                   // q : trimestre (facultatif) — l'effort ne compte alors que ce trimestre
  const list = projets.filter(p => matchPD(p) && (!V.grp || p.porteur===V.grp)).map(p => {
    const pa = q ? affsOf(p.id).filter(a => a.q===q) : affsOf(p.id);
    const vv = valeurOf(p);
    return {p, eff:sum(pa), v:vv.v, ng:new Set(pa.map(a=>a.grp)).size};
  });
  const planned = list.filter(x => x.eff > 0);
  const effs = planned.map(x => x.eff).sort((a,b) => a-b);
  const med = effs.length ? effs[Math.floor((effs.length-1)/2)] : 0;     // médiane : au-delà = effort élevé
  planned.forEach(x => {
    x.hiV = x.v >= VAL_HAUTE; x.hiE = x.eff > med;
    x.qd = x.hiV ? (x.hiE ? 2 : 1) : (x.hiE ? 4 : 3);
    x.ratio = x.v / x.eff;
  });
  return {planned, unplanned: list.filter(x => !x.eff), med};
}

function veHelp(){
  return `<div class="vehelp" id="vHelp" role="dialog" aria-label="Explication du calcul valeur / effort">
    <div class="vh-top"><b>Comment est calculé le classement ?</b><button class="vh-x" id="vHelpX" aria-label="Fermer">×</button></div>
    <h4>Valeur</h4><p>Déduite de la priorité du projet : P1 = ${VAL_AUTO.P1}, P2 = ${VAL_AUTO.P2}, P3 = ${VAL_AUTO.P3}, Poursuite = ${VAL_AUTO.Poursuite}. Valeur <b>élevée à partir de ${VAL_HAUTE}</b>.</p>
    <h4>Effort</h4><p>Somme des points d'impact du projet dans le P2A, tous groupements et trimestres : faible = 1, fort = 2. Sans impact planifié : effort nul, projet hors matrice.</p>
    <h4>Quadrants</h4><p>${[1,2,3,4].map(q => `<span class="q" style="background:${QD[q].col}1f; color:${QD[q].col}">${QD[q].nom}</span>`).join('')}</p>
    <h4>Rendement = valeur ÷ effort</h4><p>Sert au classement (tiers vert / orange / rouge) et à la courbe de Pareto (cumuls dans l'ordre du rendement).
      Sur la courbe de Pareto, la période peut être restreinte à un trimestre : l'effort ne compte alors que les impacts de ce trimestre (médiane recalculée), la valeur reste celle de la priorité.</p>
    <p class="vh-ex"><i>Exemple : projet P2, impact fort sur 2 groupements au T1 et faible sur 1 au T2 → valeur 2, effort 2 + 2 + 1 = 5, rendement 0,40.</i></p>
  </div>`;
}
let veHelpKey = false;

      <button class="vehelp-btn ${V.help?'on':''}" id="vHelpBtn" aria-label="Comment est calculé le classement ?" title="Comment est calculé le classement ?" aria-expanded="${V.help}">?</button></div>
